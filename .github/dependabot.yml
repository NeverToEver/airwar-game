version: 2
updates:
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      dev-dependencies:
        dependency-type: "development"

  - package-ecosystem: "cargo"
    directory: "/airwar_core"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    groups:
      rust-dependencies:
        dependency-type: "all"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
    groups:
      github-actions:
        dependency-type: "all"
