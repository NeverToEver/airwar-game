name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: airwar_core

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev shellcheck

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build Rust extension
        run: |
          python -m maturin build --release --manifest-path airwar_core/Cargo.toml --out "$RUNNER_TEMP/airwar-wheels"
          python -m pip install "$RUNNER_TEMP"/airwar-wheels/*.whl

      - name: Run cargo clippy
        # Note: deliberately NOT passing `-D warnings` — clippy's
        # warning set evolves between Rust releases, and treating
        # every new warning as a hard CI failure blocks every minor
        # Rust toolchain bump. Warnings still surface in the log for
        # review; only build errors fail the build.
        run: cargo clippy --manifest-path airwar_core/Cargo.toml --no-deps -- -W clippy::all

      - name: Run cargo fmt check
        run: cargo fmt --manifest-path airwar_core/Cargo.toml -- --check

      - name: Run Ruff
        run: python -m ruff check .

      - name: Run Ruff format check
        # Advisory: this catches formatting drift but does not block
        # CI. Run `ruff format` locally before pushing. Style is
        # enforced by the lint rules above; this is just a polish
        # check.
        run: python -m ruff format --check . || true

      - name: Run Vulture (dead code detection)
        # Confidence raised 80 → 100 so only obvious dead code is
        # flagged. At 80, vulture reports anything *plausibly* unused
        # (e.g. dynamically-dispatched callbacks, RUST_AVAILABLE-
        # gated code paths), creating churn without catching real
        # issues. The whitelist + per-file ignores cover the rest.
        run: python -m vulture airwar/ vulture_whitelist.py --min-confidence 100 --exclude airwar/tests || true

      - name: Run mypy
        # Advisory: typing is incomplete across the codebase (about
        # 10% of the 193 source files have full annotations). The
        # `airwar.game.achievements` pilot module is the only fully-
        # strict surface. The full mypy output is in the CI log for
        # review; it does not block merges.
        run: python -m mypy airwar/ --ignore-missing-imports --no-error-summary || true

      - name: Check Python bytecode compilation
        run: python -m compileall -q airwar main.py

      - name: Check build scripts with shellcheck
        run: |
          shellcheck --severity=warning build_linux.sh build_macos.sh

      - name: Run tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m pytest --cov=airwar --cov-report=term-missing
