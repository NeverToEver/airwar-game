name: CI

on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Personal hobby project — minimal CI. Only 4 hard gates:
#   1. Rust extension compiles (maturin build + pip install)
#   2. Python bytecode compiles (compileall)
#   3. Ruff catches real syntax/bug issues (E/F/W)
#   4. Pytest passes
# Everything else (formatters, linters, typing, dead-code,
# shellcheck, clippy-style warnings) is dropped — those are
# style preferences, not correctness, and create noise.
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: airwar_core

      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Build Rust extension
        run: |
          python -m maturin build --release --manifest-path airwar_core/Cargo.toml --out "$RUNNER_TEMP/airwar-wheels"
          python -m pip install "$RUNNER_TEMP"/airwar-wheels/*.whl

      - name: Run Rust unit tests
        # Runs the inline #[cfg(test)] mod tests in every airwar_core/ module
        # (vector2, collision, bullets, movement, sprites, particles, starfield).
        # Reuses the cached build artifacts from the previous step.
        run: cargo test --release --manifest-path airwar_core/Cargo.toml

      - name: Run Ruff (E/F/W only)
        # E = pycodestyle errors, F = pyflakes (undefined names,
        # unused imports), W = pycodestyle warnings. This is the
        # minimum sanity check — catches real syntax/bug issues
        # without nitpicking style.
        run: python -m ruff check .

      - name: Check Python bytecode compilation
        run: python -m compileall -q airwar main.py

      - name: Run tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m pytest
