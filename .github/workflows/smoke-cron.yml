name: Periodic Smoke

# P2-7: weekly smoke run against master to catch silent breakage
# (e.g. an upstream pygame/Python release that breaks our fixtures).
# Uses the same smoke subset as PR fast-path (P1-1 19ada21).

on:
  schedule:
    # Mondays 06:00 UTC = 14:00 Asia/Shanghai (Luna's timezone).
    - cron: "0 6 * * 1"
  workflow_dispatch:  # allow manual trigger from Actions tab

concurrency:
  group: periodic-smoke
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Run smoke tests
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m pytest -m smoke -v --no-cov --override-ini="addopts="
