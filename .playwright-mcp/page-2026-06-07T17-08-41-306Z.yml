          - heading "Large Class" [level=1] [ref=e18]
          - heading "Signs and Symptoms" [level=3] [ref=e19]
          - paragraph [ref=e20]: A class contains many fields/methods/lines of code.
          - figure [ref=e21]:
            - img [ref=e22]
          - heading "Reasons for the Problem" [level=3] [ref=e23]
          - paragraph [ref=e24]: Classes usually start small. But over time, they get bloated as the program grows.
          - paragraph [ref=e25]: As is the case with long methods as well, programmers usually find it mentally less taxing to place a new feature in an existing class than to create a new class for the feature.
          - figure [ref=e26]:
            - img [ref=e27]
          - heading "Treatment" [level=3] [ref=e28]
          - paragraph [ref=e29]: "When a class is wearing too many (functional) hats, think about splitting it up:"
          - list [ref=e30]:
            - listitem [ref=e31]:
              - paragraph [ref=e32]:
                - link "Extract Class" [ref=e33] [cursor=pointer]:
                  - /url: /extract-class
                - text: helps if part of the behavior of the large class can be spun off into a separate component.
            - listitem [ref=e34]:
              - paragraph [ref=e35]:
                - link "Extract Subclass" [ref=e36] [cursor=pointer]:
                  - /url: /extract-subclass
                - text: helps if part of the behavior of the large class can be implemented in different ways or is used in rare cases.
            - listitem [ref=e37]:
              - paragraph [ref=e38]:
                - link "Extract Interface" [ref=e39] [cursor=pointer]:
                  - /url: /extract-interface
                - text: helps if it’s necessary to have a list of the operations and behaviors that the client can use.
            - listitem [ref=e40]:
              - paragraph [ref=e41]:
                - text: If a large class is responsible for the graphical interface, you may try to move some of its data and behavior to a separate domain object. In doing so, it may be necessary to store copies of some data in two places and keep the data consistent.
                - link "Duplicate Observed Data" [ref=e42] [cursor=pointer]:
                  - /url: /duplicate-observed-data
                - text: offers a way to do this.
          - figure [ref=e43]:
            - img [ref=e44]
          - heading "Payoff" [level=3] [ref=e45]
          - list [ref=e46]:
            - listitem [ref=e47]:
              - paragraph [ref=e48]: Refactoring of these classes spares developers from needing to remember a large number of attributes for a class.
            - listitem [ref=e49]:
              - paragraph [ref=e50]: In many cases, splitting large classes into parts avoids duplication of code and functionality.
