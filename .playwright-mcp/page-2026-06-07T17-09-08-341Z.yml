ain fixed strings (see Tcl/Tk documentation) # user_data: data string from a virtual event or an empty string # height field: Configure, ConfigureRequest, Create, # ResizeRequest, and Expose events only # keycode field: KeyPress and KeyRelease events only # time field: \"valid for events that contain a time field\" # width field: Configure, ConfigureRequest, Create, ResizeRequest, # and Expose events only # x field: \"valid for events that contain an x field\" # y field: \"valid for events that contain a y field\" # keysym as decimal: KeyPress and KeyRelease events only # x_root, y_root fields: ButtonPress, ButtonRelease, KeyPress, # KeyRelease, and Motion events e.serial = getint(nsign) e.num = getint_event(b) if T == EventType.VirtualEvent: e.user_data = d e.detail = '??' else: e.user_data = '??' e.detail = d try: e.focus = getboolean(f) except TclError: pass e.height = getint_event(h) e.keycode = getint_event(k) e.state = getint_event(s) e.time = getint_event(t) e.width = getint_event(w) e.x = getint_event(x) e.y = getint_event(y) e.char = A try: e.send_event = getboolean(E) except TclError: pass e.keysym = K e.keysym_num = getint_event(N) try: e.type = EventType(T) except ValueError: try: e.type = EventType(str(T)) # can be int except ValueError: e.type = T try: e.widget = self._nametowidget(W) except KeyError: e.widget = W e.x_root = getint_event(X) e.y_root = getint_event(Y) try: e.delta = getint(D) except (ValueError, TclError): e.delta = 0 return (e,) def _report_exception(self): \"\"\"Internal function.\"\"\" exc, val, tb = sys.exc_info() root = self._root() root.report_callback_exception(exc, val, tb) def _getconfigure(self, *args): \"\"\"Call Tcl configure command and return the result as a dict.\"\"\" cnf = {} for x in self.tk.splitlist(self.tk.call(*args)): x = self.tk.splitlist(x) cnf[x[0][1:]] = (x[0][1:],) + x[1:] return cnf def _getconfigure1(self, *args): x = self.tk.splitlist(self.tk.call(*args)) return (x[0][1:],) + x[1:] def _configure(self, cmd, cnf, kw): \"\"\"Internal function.\"\"\" if kw: cnf = _cnfmerge((cnf, kw)) elif cnf: cnf = _cnfmerge(cnf) if cnf is None: return self._getconfigure(_flatten((self._w, cmd))) if isinstance(cnf, str): return self._getconfigure1(_flatten((self._w, cmd, '-'+cnf))) self.tk.call(_flatten((self._w, cmd)) + self._options(cnf)) # These used to be defined in Widget: def configure(self, cnf=None, **kw): \"\"\"Query or modify the configuration options of the widget. If no arguments are specified, return a dictionary describing all of the available options for the widget. If an option name is specified, then return a tuple describing the one named option. If one or more keyword arguments are specified or a dictionary is specified, then modify the widget option(s) to have the given value(s). \"\"\" return self._configure('configure', cnf, kw) config = configure def cget(self, key): \"\"\"Return the current value of the configuration option.\"\"\" return self.tk.call(self._w, 'cget', '-' + key) __getitem__ = cget __iter__ = None # prevent using __getitem__ for iteration def __setitem__(self, key, value): self.configure({key: value}) def keys(self): \"\"\"Return a list of all option names of this widget.\"\"\" splitlist = self.tk.splitlist return [splitlist(x)[0][1:] for x in splitlist(self.tk.call(self._w, 'configure'))] def __str__(self): \"\"\"Return the window path name of this widget.\"\"\" return self._w def __repr__(self): return '<%s.%s object %s>' % ( self.__class__.__module__, self.__class__.__qualname__, self._w) # Pack methods that apply to the container widget _noarg_ = ['_noarg_'] def pack_propagate(self, flag=_noarg_): \"\"\"Set or get the status for propagation of geometry information. A boolean argument specifies whether the size of this container will be determined by the geometry information of its content. If no argument is given the current setting will be returned. \"\"\" if flag is Misc._noarg_: return self._getboolean(self.tk.call( 'pack', 'propagate', self._w)) else: self.tk.call('pack', 'propagate', self._w, flag) propagate = pack_propagate def pack_content(self): \"\"\"Returns a list of all of the content widgets in the packing order for this container.\"\"\" try: res = self.tk.call('pack', 'content', self._w) except TclError: if self.info_patchlevel() >= (8, 6): raise res = self.tk.call('pack', 'slaves', self._w) return [self._nametowidget(x) for x in self.tk.splitlist(res)] content = pack_content def pack_slaves(self): \"\"\"Synonym for pack_content().\"\"\" return [self._nametowidget(x) for x in self.tk.splitlist( self.tk.call('pack', 'slaves', self._w))] slaves = pack_slaves # Place method that applies to the container widget def place_content(self): \"\"\"Returns a list of all the content widgets for which this widget is the container.\"\"\" try: res = self.tk.call('place', 'content', self._w) except TclError: if self.info_patchlevel() >= (8, 6): raise res = self.tk.call('place', 'slaves', self._w) return [self._nametowidget(x) for x in self.tk.splitlist(res)] def place_slaves(self): \"\"\"Synonym for place_content().\"\"\" return [self._nametowidget(x) for x in self.tk.splitlist( self.tk.call( 'place', 'slaves', self._w))] # Grid methods that apply to the container widget def grid_anchor(self, anchor=None): # new in Tk 8.5 \"\"\"The anchor value controls how to place the grid within the container widget when no row/column has any weight. The default anchor is nw.\"\"\" self.tk.call('grid', 'anchor', self._w, anchor) anchor = grid_anchor def grid_bbox(self, column=None, row=None, col2=None, row2=None): \"\"\"Return a tuple of integer coordinates for the bounding box of this widget controlled by the geometry manager grid. If COLUMN, ROW is given the bounding box applies from the cell with row and column 0 to the specified cell. If COL2 and ROW2 are given the bounding box starts at that cell. The returned integers specify the offset of the upper left corner in the container widget and the width and height. \"\"\" args = ('grid', 'bbox', self._w) if column is not None and row is not None: args = args + (column, row) if col2 is not None and row2 is not None: args = args + (col2, row2) return self._getints(self.tk.call(*args)) or None bbox = grid_bbox def _gridconvvalue(self, value): if isinstance(value, (str, _tkinter.Tcl_Obj)): try: svalue = str(value) if not svalue: return None elif '.' in svalue: return self.tk.getdouble(svalue) else: return self.tk.getint(svalue) except (ValueError, TclError): pass return value def _grid_configure(self, command, index, cnf, kw): \"\"\"Internal function.\"\"\" if isinstance(cnf, str) and not kw: if cnf[-1:] == '_': cnf = cnf[:-1] if cnf[:1] != '-': cnf = '-'+cnf options = (cnf,) else: options = self._options(cnf, kw) if not options: return _splitdict( self.tk, self.tk.call('grid', command, self._w, index), conv=self._gridconvvalue) res = self.tk.call( ('grid', command, self._w, index) + options) if len(options) == 1: return self._gridconvvalue(res) def grid_columnconfigure(self, index, cnf={}, **kw): \"\"\"Configure column INDEX of a grid. Valid options are minsize (minimum size of the column), weight (how much does additional space propagate to this column) and pad (how much space to let additionally).\"\"\" return self._grid_configure('columnconfigure', index, cnf, kw) columnconfigure = grid_columnconfigure def grid_location(self, x, y): \"\"\"Return a tuple of column and row which identify the cell at which the pixel at position X and Y inside the container widget is located.\"\"\" return self._getints( self.tk.call( 'grid', 'location', self._w, x, y)) or None def grid_propagate(self, flag=_noarg_): \"\"\"Set or get the status for propagation of geometry information. A boolean argument specifies whether the size of this container will be determined by the geometry information of its content. If no argument is given the current setting will be returned. \"\"\" if flag is Misc._noarg_: return self._getboolean(self.tk.call( 'grid', 'propagate', self._w)) else: self.tk.call('grid', 'propagate', self._w, flag) def grid_rowconfigure(self, index, cnf={}, **kw): \"\"\"Configure row INDEX of a grid. Valid options are minsize (minimum size of the row), weight (how much does additional space propagate to this row) and pad (how much space to let additionally).\"\"\" return self._grid_configure('rowconfigure', index, cnf, kw) rowconfigure = grid_rowconfigure def grid_size(self): \"\"\"Return a tuple of the number of column and rows in the grid.\"\"\" return self._getints( self.tk.call('grid', 'size', self._w)) or None size = grid_size def grid_content(self, row=None, column=None): \"\"\"Returns a list of the content widgets. If no arguments are supplied, a list of all of the content in this container widget is returned, most recently managed first. If ROW or COLUMN is specified, only the content in the row or column is returned. \"\"\" args = () if row is not None: args = args + ('-row', row) if column is not None: args = args + ('-column', column) try: res = self.tk.call('grid', 'content', self._w, *args) except TclError: if self.info_patchlevel() >= (8, 6): raise res = self.tk.call('grid', 'slaves', self._w, *args) return [self._nametowidget(x) for x in self.tk.splitlist(res)] def grid_slaves(self, row=None, column=None): \"\"\"Synonym for grid_content().\"\"\" args = () if row is not None: args = args + ('-row', row) if column is not None: args = args + ('-column', column) return [self._nametowidget(x) for x in self.tk.splitlist(self.tk.call( ('grid', 'slaves', self._w) + args))] # Support for the \"event\" command, new in Tk 4.2. # By Case Roole. def event_add(self, virtual, *sequences): \"\"\"Bind a virtual event VIRTUAL (of the form <<Name>>) to an event SEQUENCE such that the virtual event is triggered whenever SEQUENCE occurs.\"\"\" args = ('event', 'add', virtual) + sequences self.tk.call(args) def event_delete(self, virtual, *sequences): \"\"\"Unbind a virtual event VIRTUAL from SEQUENCE.\"\"\" args = ('event', 'delete', virtual) + sequences self.tk.call(args) def event_generate(self, sequence, **kw): \"\"\"Generate an event SEQUENCE. Additional keyword arguments specify parameter of the event (e.g. x, y, rootx, rooty).\"\"\" args = ('event', 'generate', self._w, sequence) for k, v in kw.items(): args = args + ('-%s' % k, str(v)) self.tk.call(args) def event_info(self, virtual=None): \"\"\"Return a list of all virtual events or the information about the SEQUENCE bound to the virtual event VIRTUAL.\"\"\" return self.tk.splitlist( self.tk.call('event', 'info', virtual)) # Image related commands def image_names(self): \"\"\"Return a list of all existing image names.\"\"\" return self.tk.splitlist(self.tk.call('image', 'names')) def image_types(self): \"\"\"Return a list of all available image types (e.g. photo bitmap).\"\"\" return self.tk.splitlist(self.tk.call('image', 'types')) class CallWrapper: \"\"\"Internal class. Stores function to call when some user defined Tcl function is called e.g. after an event occurred.\"\"\" def __init__(self, func, subst, widget): \"\"\"Store FUNC, SUBST and WIDGET as members.\"\"\" self.func = func self.subst = subst self.widget = widget def __call__(self, *args): \"\"\"Apply first function SUBST to arguments, than FUNC.\"\"\" try: if self.subst: args = self.subst(*args) return self.func(*args) except SystemExit: raise except: self.widget._report_exception() class XView: \"\"\"Mix-in class for querying and changing the horizontal position of a widget's window.\"\"\" def xview(self, *args): \"\"\"Query and change the horizontal position of the view.\"\"\" res = self.tk.call(self._w, 'xview', *args) if not args: return self._getdoubles(res) def xview_moveto(self, fraction): \"\"\"Adjusts the view in the window so that FRACTION of the total width of the canvas is off-screen to the left.\"\"\" self.tk.call(self._w, 'xview', 'moveto', fraction) def xview_scroll(self, number, what): \"\"\"Shift the x-view according to NUMBER which is measured in \"units\" or \"pages\" (WHAT).\"\"\" self.tk.call(self._w, 'xview', 'scroll', number, what) class YView: \"\"\"Mix-in class for querying and changing the vertical position of a widget's window.\"\"\" def yview(self, *args): \"\"\"Query and change the vertical position of the view.\"\"\" res = self.tk.call(self._w, 'yview', *args) if not args: return self._getdoubles(res) def yview_moveto(self, fraction): \"\"\"Adjusts the view in the window so that FRACTION of the total height of the canvas is off-screen to the top.\"\"\" self.tk.call(self._w, 'yview', 'moveto', fraction) def yview_scroll(self, number, what): \"\"\"Shift the y-view according to NUMBER which is measured in \"units\" or \"pages\" (WHAT).\"\"\" self.tk.call(self._w, 'yview', 'scroll', number, what) class Wm: \"\"\"Provides functions for the communication with the window manager.\"\"\" def wm_aspect(self, minNumer=None, minDenom=None, maxNumer=None, maxDenom=None): \"\"\"Instruct the window manager to set the aspect ratio (width/height) of this widget to be between MINNUMER/MINDENOM and MAXNUMER/MAXDENOM. Return a tuple of the actual values if no argument is given.\"\"\" return self._getints( self.tk.call('wm', 'aspect', self._w, minNumer, minDenom, maxNumer, maxDenom)) aspect = wm_aspect def wm_attributes(self, *args, return_python_dict=False, **kwargs): \"\"\"Return or sets platform specific attributes. When called with a single argument return_python_dict=True, return a dict of the platform specific attributes and their values. When called without arguments or with a single argument return_python_dict=False, return a tuple containing intermixed attribute names with the minus prefix and their values. When called with a single string value, return the value for the specific option. When called with keyword arguments, set the corresponding attributes. \"\"\" if not kwargs: if not args: res = self.tk.call('wm', 'attributes', self._w) if return_python_dict: return _splitdict(self.tk, res) else: return self.tk.splitlist(res) if len(args) == 1 and args[0] is not None: option = args[0] if option[0] == '-': # TODO: deprecate option = option[1:] return self.tk.call('wm', 'attributes', self._w, '-' + option) # TODO: deprecate return self.tk.call('wm', 'attributes', self._w, *args) elif args: raise TypeError('wm_attribute() options have been specified as ' 'positional and keyword arguments') else: self.tk.call('wm', 'attributes', self._w, *self._options(kwargs)) attributes = wm_attributes def wm_client(self, name=None): \"\"\"Store NAME in WM_CLIENT_MACHINE property of this widget. Return current value.\"\"\" return self.tk.call('wm', 'client', self._w, name) client = wm_client def wm_colormapwindows(self, *wlist): \"\"\"Store list of window names (WLIST) into WM_COLORMAPWINDOWS property of this widget. This list contains windows whose colormaps differ from their parents. Return current list of widgets if WLIST is empty.\"\"\" if len(wlist) > 1: wlist = (wlist,) # Tk needs a list of windows here args = ('wm', 'colormapwindows', self._w) + wlist if wlist: self.tk.call(args) else: return [self._nametowidget(x) for x in self.tk.splitlist(self.tk.call(args))] colormapwindows = wm_colormapwindows def wm_command(self, value=None): \"\"\"Store VALUE in WM_COMMAND property. It is the command which shall be used to invoke the application. Return current command if VALUE is None.\"\"\" return self.tk.call('wm', 'command', self._w, value) command = wm_command def wm_deiconify(self): \"\"\"Deiconify this widget. If it was never mapped it will not be mapped. On Windows it will raise this widget and give it the focus.\"\"\" return self.tk.call('wm', 'deiconify', self._w) deiconify = wm_deiconify def wm_focusmodel(self, model=None): \"\"\"Set focus model to MODEL. \"active\" means that this widget will claim the focus itself, \"passive\" means that the window manager shall give the focus. Return current focus model if MODEL is None.\"\"\" return self.tk.call('wm', 'focusmodel', self._w, model) focusmodel = wm_focusmodel def wm_forget(self, window): # new in Tk 8.5 \"\"\"The window will be unmapped from the screen and will no longer be managed by wm. toplevel windows will be treated like frame windows once they are no longer managed by wm, however, the menu option configuration will be remembered and the menus will return once the widget is managed again.\"\"\" self.tk.call('wm', 'forget', window) forget = wm_forget def wm_frame(self): \"\"\"Return identifier for decorative frame of this widget if present.\"\"\" return self.tk.call('wm', 'frame', self._w) frame = wm_frame def wm_geometry(self, newGeometry=None): \"\"\"Set geometry to NEWGEOMETRY of the form =widthxheight+x+y. Return current value if None is given.\"\"\" return self.tk.call('wm', 'geometry', self._w, newGeometry) geometry = wm_geometry def wm_grid(self, baseWidth=None, baseHeight=None, widthInc=None, heightInc=None): \"\"\"Instruct the window manager that this widget shall only be resized on grid boundaries. WIDTHINC and HEIGHTINC are the width and height of a grid unit in pixels. BASEWIDTH and BASEHEIGHT are the number of grid units requested in Tk_GeometryRequest.\"\"\" return self._getints(self.tk.call( 'wm', 'grid', self._w, baseWidth, baseHeight, widthInc, heightInc)) grid = wm_grid def wm_group(self, pathName=None): \"\"\"Set the group leader widgets for related widgets to PATHNAME. Return the group leader of this widget if None is given.\"\"\" return self.tk.call('wm', 'group', self._w, pathName) group = wm_group def wm_iconbitmap(self, bitmap=None, default=None): \"\"\"Set bitmap for the iconified widget to BITMAP. Return the bitmap if None is given. Under Windows, the DEFAULT parameter can be used to set the icon for the widget and any descendants that don't have an icon set explicitly. DEFAULT can be the relative path to a .ico file (example: root.iconbitmap(default='myicon.ico') ). See Tk documentation for more information.\"\"\" if default is not None: return self.tk.call('wm', 'iconbitmap', self._w, '-default', default) else: return self.tk.call('wm', 'iconbitmap', self._w, bitmap) iconbitmap = wm_iconbitmap def wm_iconify(self): \"\"\"Display widget as icon.\"\"\" return self.tk.call('wm', 'iconify', self._w) iconify = wm_iconify def wm_iconmask(self, bitmap=None): \"\"\"Set mask for the icon bitmap of this widget. Return the mask if None is given.\"\"\" return self.tk.call('wm', 'iconmask', self._w, bitmap) iconmask = wm_iconmask def wm_iconname(self, newName=None): \"\"\"Set the name of the icon for this widget. Return the name if None is given.\"\"\" return self.tk.call('wm', 'iconname', self._w, newName) iconname = wm_iconname def wm_iconphoto(self, default=False, *args): # new in Tk 8.5 \"\"\"Sets the titlebar icon for this window based on the named photo images passed through args. If default is True, this is applied to all future created toplevels as well. The data in the images is taken as a snapshot at the time of invocation. If the images are later changed, this is not reflected to the titlebar icons. Multiple images are accepted to allow different images sizes to be provided. The window manager may scale provided icons to an appropriate size. On Windows, the images are packed into a Windows icon structure. This will override an icon specified to wm_iconbitmap, and vice versa. On X, the images are arranged into the _NET_WM_ICON X property, which most modern window managers support. An icon specified by wm_iconbitmap may exist simultaneously. On Macintosh, this currently does nothing.\"\"\" if default: self.tk.call('wm', 'iconphoto', self._w, \"-default\", *args) else: self.tk.call('wm', 'iconphoto', self._w, *args) iconphoto = wm_iconphoto def wm_iconposition(self, x=None, y=None): \"\"\"Set the position of the icon of this widget to X and Y. Return a tuple of the current values of X and X if None is given.\"\"\" return self._getints(self.tk.call( 'wm', 'iconposition', self._w, x, y)) iconposition = wm_iconposition def wm_iconwindow(self, pathName=None): \"\"\"Set widget PATHNAME to be displayed instead of icon. Return the current value if None is given.\"\"\" return self.tk.call('wm', 'iconwindow', self._w, pathName) iconwindow = wm_iconwindow def wm_manage(self, widget): # new in Tk 8.5 \"\"\"The widget specified will become a stand alone top-level window. The window will be decorated with the window managers title bar, etc.\"\"\" self.tk.call('wm', 'manage', widget) manage = wm_manage def wm_maxsize(self, width=None, height=None): \"\"\"Set max WIDTH and HEIGHT for this widget. If the window is gridded the values are given in grid units. Return the current values if None is given.\"\"\" return self._getints(self.tk.call( 'wm', 'maxsize', self._w, width, height)) maxsize = wm_maxsize def wm_minsize(self, width=None, height=None): \"\"\"Set min WIDTH and HEIGHT for this widget. If the window is gridded the values are given in grid units. Return the current values if None is given.\"\"\" return self._getints(self.tk.call( 'wm', 'minsize', self._w, width, height)) minsize = wm_minsize def wm_overrideredirect(self, boolean=None): \"\"\"Instruct the window manager to ignore this widget if BOOLEAN is given with 1. Return the current value if None is given.\"\"\" return self._getboolean(self.tk.call( 'wm', 'overrideredirect', self._w, boolean)) overrideredirect = wm_overrideredirect def wm_positionfrom(self, who=None): \"\"\"Instruct the window manager that the position of this widget shall be defined by the user if WHO is \"user\", and by its own policy if WHO is \"program\".\"\"\" return self.tk.call('wm', 'positionfrom', self._w, who) positionfrom = wm_positionfrom def wm_protocol(self, name=None, func=None): \"\"\"Bind function FUNC to command NAME for this widget. Return the function bound to NAME if None is given. NAME could be e.g. \"WM_SAVE_YOURSELF\" or \"WM_DELETE_WINDOW\".\"\"\" if callable(func): command = self._register(func) else: command = func return self.tk.call( 'wm', 'protocol', self._w, name, command) protocol = wm_protocol def wm_resizable(self, width=None, height=None): \"\"\"Instruct the window manager whether this width can be resized in WIDTH or HEIGHT. Both values are boolean values.\"\"\" return self.tk.call('wm', 'resizable', self._w, width, height) resizable = wm_resizable def wm_sizefrom(self, who=None): \"\"\"Instruct the window manager that the size of this widget shall be defined by the user if WHO is \"user\", and by its own policy if WHO is \"program\".\"\"\" return self.tk.call('wm', 'sizefrom', self._w, who) sizefrom = wm_sizefrom def wm_state(self, newstate=None): \"\"\"Query or set the state of this widget as one of normal, icon, iconic (see wm_iconwindow), withdrawn, or zoomed (Windows only).\"\"\" return self.tk.call('wm', 'state', self._w, newstate) state = wm_state def wm_title(self, string=None): \"\"\"Set the title of this widget.\"\"\" return self.tk.call('wm', 'title', self._w, string) title = wm_title def wm_transient(self, master=None): \"\"\"Instruct the window manager that this widget is transient with regard to widget MASTER.\"\"\" return self.tk.call('wm', 'transient', self._w, master) transient = wm_transient def wm_withdraw(self): \"\"\"Withdraw this widget from the screen such that it is unmapped and forgotten by the window manager. Re-draw it with wm_deiconify.\"\"\" return self.tk.call('wm', 'withdraw', self._w) withdraw = wm_withdraw class Tk(Misc, Wm): \"\"\"Toplevel widget of Tk which represents mostly the main window of an application. It has an associated Tcl interpreter.\"\"\" _w = '.' def __init__(self, screenName=None, baseName=None, className='Tk', useTk=True, sync=False, use=None): \"\"\"Return a new top level widget on screen SCREENNAME. A new Tcl interpreter will be created. BASENAME will be used for the identification of the profile file (see readprofile). It is constructed from sys.argv[0] without extensions if None is given. CLASSNAME is the name of the widget class.\"\"\" self.master = None self.children = {} self._tkloaded = False # to avoid recursions in the getattr code in case of failure, we # ensure that self.tk is always _something_. self.tk = None if baseName is None: import os baseName = os.path.basename(sys.argv[0]) baseName, ext = os.path.splitext(baseName) if ext not in ('.py', '.pyc'): baseName = baseName + ext interactive = False self.tk = _tkinter.create(screenName, baseName, className, interactive, wantobjects, useTk, sync, use) if _debug: self.tk.settrace(_print_command) if useTk: self._loadtk() if not sys.flags.ignore_environment: # Issue #16248: Honor the -E flag to avoid code injection. self.readprofile(baseName, className) def loadtk(self): if not self._tkloaded: self.tk.loadtk() self._loadtk() def _loadtk(self): self._tkloaded = True global _default_root # Version sanity checks tk_version = self.tk.getvar('tk_version') if tk_version != _tkinter.TK_VERSION: raise RuntimeError(\"tk.h version (%s) doesn't match libtk.a version (%s)\" % (_tkinter.TK_VERSION, tk_version)) # Under unknown circumstances, tcl_version gets coerced to float tcl_version = str(self.tk.getvar('tcl_version')) if tcl_version != _tkinter.TCL_VERSION: raise RuntimeError(\"tcl.h version (%s) doesn't match libtcl.a version (%s)\" \\ % (_tkinter.TCL_VERSION, tcl_version)) # Create and register the tkerror and exit commands # We need to inline parts of _register here, _ register # would register differently-named commands. if self._tclCommands is None: self._tclCommands = [] self.tk.createcommand('tkerror', _tkerror) self.tk.createcommand('exit', _exit) self._tclCommands.append('tkerror') self._tclCommands.append('exit') if _support_default_root and _default_root is None: _default_root = self self.protocol(\"WM_DELETE_WINDOW\", self.destroy) def destroy(self): \"\"\"Destroy this and all descendants widgets. This will end the application of this Tcl interpreter.\"\"\" for c in list(self.children.values()): c.destroy() self.tk.call('destroy', self._w) Misc.destroy(self) global _default_root if _support_default_root and _default_root is self: _default_root = None def readprofile(self, baseName, className): \"\"\"Internal function. It reads .BASENAME.tcl and .CLASSNAME.tcl into the Tcl Interpreter and calls exec on the contents of .BASENAME.py and .CLASSNAME.py if such a file exists in the home directory.\"\"\" import os if 'HOME' in os.environ: home = os.environ['HOME'] else: home = os.curdir class_tcl = os.path.join(home, '.%s.tcl' % className) class_py = os.path.join(home, '.%s.py' % className) base_tcl = os.path.join(home, '.%s.tcl' % baseName) base_py = os.path.join(home, '.%s.py' % baseName) dir = {'self': self} exec('from tkinter import *', dir) if os.path.isfile(class_tcl): self.tk.call('source', class_tcl) if os.path.isfile(class_py): exec(open(class_py).read(), dir) if os.path.isfile(base_tcl): self.tk.call('source', base_tcl) if os.path.isfile(base_py): exec(open(base_py).read(), dir) def report_callback_exception(self, exc, val, tb): \"\"\"Report callback exception on sys.stderr. Applications may want to override this internal function, and should when sys.stderr is None.\"\"\" import traceback print(\"Exception in Tkinter callback\", file=sys.stderr) sys.last_exc = val sys.last_type = exc sys.last_value = val sys.last_traceback = tb traceback.print_exception(exc, val, tb) def __getattr__(self, attr): \"Delegate attribute access to the interpreter object\" return getattr(self.tk, attr) def _print_command(cmd, *, file=sys.stderr): # Print executed Tcl/Tk commands. assert isinstance(cmd, tuple) cmd = _join(cmd) print(cmd, file=file) # Ideally, the classes Pack, Place and Grid disappear, the # pack/place/grid methods are defined on the Widget class, and # everybody uses w.pack_whatever(...) instead of Pack.whatever(w, # ...), with pack(), place() and grid() being short for # pack_configure(), place_configure() and grid_columnconfigure(), and # forget() being short for pack_forget(). As a practical matter, I'm # afraid that there is too much code out there that may be using the # Pack, Place or Grid class, so I leave them intact -- but only as # backwards compatibility features. Also note that those methods that # take a master as argument (e.g. pack_propagate) have been moved to # the Misc class (which now incorporates all methods common between # toplevel and interior widgets). Again, for compatibility, these are # copied into the Pack, Place or Grid class. def Tcl(screenName=None, baseName=None, className='Tk', useTk=False): return Tk(screenName, baseName, className, useTk) class Pack: \"\"\"Geometry manager Pack. Base class to use the methods pack_* in every widget.\"\"\" def pack_configure(self, cnf={}, **kw): \"\"\"Pack a widget in the parent widget. Use as options: after=widget - pack it after you have packed widget anchor=NSEW (or subset) - position widget according to given direction before=widget - pack it before you will pack widget expand=bool - expand widget if parent size grows fill=NONE or X or Y or BOTH - fill widget if widget grows in=container - use the container widget to contain this widget in_=container - see 'in' option description ipadx=amount - add internal padding in x direction ipady=amount - add internal padding in y direction padx=amount - add padding in x direction pady=amount - add padding in y direction side=TOP or BOTTOM or LEFT or RIGHT - where to add this widget. \"\"\" self.tk.call( ('pack', 'configure', self._w) + self._options(cnf, kw)) pack = configure = config = pack_configure def pack_forget(self): \"\"\"Unmap this widget and do not use it for the packing order.\"\"\" self.tk.call('pack', 'forget', self._w) forget = pack_forget def pack_info(self): \"\"\"Return information about the packing options for this widget.\"\"\" d = _splitdict(self.tk, self.tk.call('pack', 'info', self._w)) if 'in' in d: d['in'] = self.nametowidget(d['in']) return d info = pack_info propagate = pack_propagate = Misc.pack_propagate content = pack_content = Misc.pack_content slaves = pack_slaves = Misc.pack_slaves class Place: \"\"\"Geometry manager Place. Base class to use the methods place_* in every widget.\"\"\" def place_configure(self, cnf={}, **kw): \"\"\"Place a widget in the parent widget. Use as options: in=container - the container widget relative to which this widget is placed in_=container - see 'in' option description x=amount - locate anchor of this widget at position x of the container widget y=amount - locate anchor of this widget at position y of the container widget relx=amount - locate anchor of this widget between 0.0 and 1.0 relative to width of the container widget (1.0 is right edge) rely=amount - locate anchor of this widget between 0.0 and 1.0 relative to height of the container widget (1.0 is bottom edge) anchor=NSEW (or subset) - position anchor according to given direction width=amount - width of this widget in pixel height=amount - height of this widget in pixel relwidth=amount - width of this widget between 0.0 and 1.0 relative to width of the container widget (1.0 is the same width as the container widget) relheight=amount - height of this widget between 0.0 and 1.0 relative to height of the container widget (1.0 is the same height as the container widget) bordermode=\"inside\" or \"outside\" - whether to take border width of the container widget into account \"\"\" self.tk.call( ('place', 'configure', self._w) + self._options(cnf, kw)) place = configure = config = place_configure def place_forget(self): \"\"\"Unmap this widget.\"\"\" self.tk.call('place', 'forget', self._w) forget = place_forget def place_info(self): \"\"\"Return information about the placing options for this widget.\"\"\" d = _splitdict(self.tk, self.tk.call('place', 'info', self._w)) if 'in' in d: d['in'] = self.nametowidget(d['in']) return d info = place_info content = place_content = Misc.place_content slaves = place_slaves = Misc.place_slaves class Grid: \"\"\"Geometry manager Grid. Base class to use the methods grid_* in every widget.\"\"\" # Thanks to Masazumi Yoshikawa (yosikawa@isi.edu) def grid_configure(self, cnf={}, **kw): \"\"\"Position a widget in the parent widget in a grid. Use as options: column=number - use cell identified with given column (starting with 0) columnspan=number - this widget will span several columns in=container - use the container widget to contain this widget in_=container - see 'in' option description ipadx=amount - add internal padding in x direction ipady=amount - add internal padding in y direction padx=amount - add padding in x direction pady=amount - add padding in y direction row=number - use cell identified with given row (starting with 0) rowspan=number - this widget will span several rows sticky=NSEW - if cell is larger on which sides will this widget stick to the cell boundary \"\"\" self.tk.call( ('grid', 'configure', self._w) + self._options(cnf, kw)) grid = configure = config = grid_configure bbox = grid_bbox = Misc.grid_bbox columnconfigure = grid_columnconfigure = Misc.grid_columnconfigure def grid_forget(self): \"\"\"Unmap this widget.\"\"\" self.tk.call('grid', 'forget', self._w) forget = grid_forget def grid_remove(self): \"\"\"Unmap this widget but remember the grid options.\"\"\" self.tk.call('grid', 'remove', self._w) def grid_info(self): \"\"\"Return information about the options for positioning this widget in a grid.\"\"\" d = _splitdict(self.tk, self.tk.call('grid', 'info', self._w)) if 'in' in d: d['in'] = self.nametowidget(d['in']) return d info = grid_info location = grid_location = Misc.grid_location propagate = grid_propagate = Misc.grid_propagate rowconfigure = grid_rowconfigure = Misc.grid_rowconfigure size = grid_size = Misc.grid_size content = grid_content = Misc.grid_content slaves = grid_slaves = Misc.grid_slaves class BaseWidget(Misc): \"\"\"Internal class.\"\"\" def _setup(self, master, cnf): \"\"\"Internal function. Sets up information about children.\"\"\" if master is None: master = _get_default_root() self.master = master self.tk = master.tk name = None if 'name' in cnf: name = cnf['name'] del cnf['name'] if not name: name = self.__class__.__name__.lower() if name[-1].isdigit(): name += \"!\" # Avoid duplication when calculating names below if master._last_child_ids is None: master._last_child_ids = {} count = master._last_child_ids.get(name, 0) + 1 master._last_child_ids[name] = count if count == 1: name = '!%s' % (name,) else: name = '!%s%d' % (name, count) self._name = name if master._w=='.': self._w = '.' + name else: self._w = master._w + '.' + name self.children = {} if self._name in self.master.children: self.master.children[self._name].destroy() self.master.children[self._name] = self def __init__(self, master, widgetName, cnf={}, kw={}, extra=()): \"\"\"Construct a widget with the parent widget MASTER, a name WIDGETNAME and appropriate options.\"\"\" if kw: cnf = _cnfmerge((cnf, kw)) self.widgetName = widgetName self._setup(master, cnf) if self._tclCommands is None: self._tclCommands = [] classes = [(k, v) for k, v in cnf.items() if isinstance(k, type)] for k, v in classes: del cnf[k] self.tk.call( (widgetName, self._w) + extra + self._options(cnf)) for k, v in classes: k.configure(self, v) def destroy(self): \"\"\"Destroy this and all descendants widgets.\"\"\" for c in list(self.children.values()): c.destroy() self.tk.call('destroy', self._w) if self._name in self.master.children: del self.master.children[self._name] Misc.destroy(self) def _do(self, name, args=()): # XXX Obsolete -- better use self.tk.call directly! return self.tk.call((self._w, name) + args) class Widget(BaseWidget, Pack, Place, Grid): \"\"\"Internal class. Base class for a widget which can be positioned with the geometry managers Pack, Place or Grid.\"\"\" pass class Toplevel(BaseWidget, Wm): \"\"\"Toplevel widget, e.g. for dialogs.\"\"\" def __init__(self, master=None, cnf={}, **kw): \"\"\"Construct a toplevel widget with the parent MASTER. Valid option names: background, bd, bg, borderwidth, class, colormap, container, cursor, height, highlightbackground, highlightcolor, highlightthickness, menu, relief, screen, takefocus, use, visual, width.\"\"\" if kw: cnf = _cnfmerge((cnf, kw)) extra = () for wmkey in ['screen', 'class_', 'class', 'visual', 'colormap']: if wmkey in cnf: val = cnf[wmkey] # TBD: a hack needed because some keys # are not valid as keyword arguments if wmkey[-1] == '_': opt = '-'+wmkey[:-1] else: opt = '-'+wmkey extra = extra + (opt, val) del cnf[wmkey] BaseWidget.__init__(self, master, 'toplevel', cnf, {}, extra) root = self._root() self.iconname(root.iconname()) self.title(root.title()) self.protocol(\"WM_DELETE_WINDOW\", self.destroy) class Button(Widget): \"\"\"Button widget.\"\"\" def __init__(self, master=None, cnf={}, **kw): \"\"\"Construct a button widget with the parent MASTER. STANDARD OPTIONS activebackground, activeforeground, anchor, background, bitmap, borderwidth, cursor, disabledforeground, font, foreground highlightbackground, highlightcolor, highlightthickness, image, justify, padx, pady, relief, repeatdelay, repeatinterval, takefocus, text, textvariable, underline, wraplength WIDGET-SPECIFIC OPTIONS command, compound, default, height, overrelief, state, width \"\"\" Widget.__init__(self, master, 'button', cnf, kw) def flash(self): \"\"\"Flash the button. This is accomplished by redisplaying the button several times, alternating between active and normal colors. At the end of the flash the button is left in the same normal/active state as when the command was invoked. This command is ignored if the button's state is disabled. \"\"\" self.tk.call(self._w, 'flash') def invoke(self): \"\"\"Invoke the command associated with the button. The return value is the return value from the command, or an empty string if there is no command associated with the button. This command is ignored if the button's state is disabled. \"\"\" return self.tk.call(self._w, 'invoke') class Canvas(Widget, XView, YView): \"\"\"Canvas widget to display graphical elements like lines or text.\"\"\" def __init__(self, master=None, cnf={}, **kw): \"\"\"Construct a canvas widget with the parent MASTER. Valid option names: background, bd, bg, borderwidth, closeenough, confine, cursor, height, highlightbackground, highlightcolor, highlightthickness, insertbackground, insertborderwidth, insertofftime, insertontime, insertwidth, offset, relief, scrollregion, selectbackground, selectborderwidth, selectforeground, state, takefocus, width, xscrollcommand, xscrollincrement, yscrollcommand, yscrollincrement.\"\"\" Widget.__init__(self, master, 'canvas', cnf, kw) def addtag(self, *args): \"\"\"Internal function.\"\"\" self.tk.call((self._w, 'addtag') + args) def addtag_above(self, newtag, tagOrId): \"\"\"Add tag NEWTAG to all items above TAGORID.\"\"\" self.addtag(newtag, 'above', tagOrId) def addtag_all(self, newtag): \"\"\"Add tag NEWTAG to all items.\"\"\" self.addtag(newtag, 'all') def addtag_below(self, newtag, tagOrId): \"\"\"Add tag NEWTAG to all items below TAGORID.\"\"\" self.addtag(newtag, 'below', tagOrId) def addtag_closest(self, newtag, x, y, halo=None, start=None): \"\"\"Add tag NEWTAG to item which is closest to pixel at X, Y. If several match take the top-most. All items closer than HALO are considered overlapping (all are closest). If START is specified the next below this tag is taken.\"\"\" self.addtag(newtag, 'closest', x, y, halo, start) def addtag_enclosed(self, newtag, x1, y1, x2, y2): \"\"\"Add tag NEWTAG to all items in the rectangle defined by X1,Y1,X2,Y2.\"\"\" self.addtag(newtag, 'enclosed', x1, y1, x2, y2) def addtag_overlapping(self, newtag, x1, y1, x2, y2): \"\"\"Add tag NEWTAG to all items which overlap the rectangle defined by X1,Y1,X2,Y2.\"\"\" self.addtag(newtag, 'overlapping', x1, y1, x2, y2) def addtag_withtag(self, newtag, tagOrId): \"\"\"Add tag NEWTAG to all items with TAGORID.\"\"\" self.addtag(newtag, 'withtag', tagOrId) def bbox(self, *args): \"\"\"Return a tuple of X1,Y1,X2,Y2 coordinates for a rectangle which encloses all items with tags specified as arguments.\"\"\" return self._getints( self.tk.call((self._w, 'bbox') + args)) or None def tag_unbind(self, tagOrId, sequence, funcid=None): \"\"\"Unbind for all items with TAGORID for event SEQUENCE the function identified with FUNCID.\"\"\" self._unbind((self._w, 'bind', tagOrId, sequence), funcid) def tag_bind(self, tagOrId, sequence=None, func=None, add=None): \"\"\"Bind to all items with TAGORID at event SEQUENCE a call to function FUNC. An additional boolean parameter ADD specifies whether FUNC will be called additionally to the other bound function or whether it will replace the previous function. See bind for the return value.\"\"\" return self._bind((self._w, 'bind', tagOrId), sequence, func, add) def canvasx(self, screenx, gridspacing=None): \"\"\"Return the canvas x coordinate of pixel position SCREENX rounded to nearest multiple of GRIDSPACING units.\"\"\" return self.tk.getdouble(self.tk.call( self._w, 'canvasx', screenx, gridspacing)) def canvasy(self, screeny, gridspacing=None): \"\"\"Return the canvas y coordinate of pixel position SCREENY rounded to nearest multiple of GRIDSPACING units.\"\"\" return self.tk.getdouble(self.tk.call( self._w, 'canvasy', screeny, gridspacing)) def coords(self, *args): \"\"\"Return a list of coordinates for the item given in ARGS.\"\"\" args = _flatten(args) return [self.tk.getdouble(x) for x in self.tk.splitlist( self.tk.call((self._w, 'coords') + args))] def _create(self, itemType, args, kw): # Args: (val, val, ..., cnf={}) \"\"\"Internal function.\"\"\" args = _flatten(args) cnf = args[-1] if isinstance(cnf, (dict, tuple)): args = args[:-1] else: cnf = {} return self.tk.getint(self.tk.call( self._w, 'create', itemType, *(args + self._options(cnf, kw)))) def create_arc(self, *args, **kw): \"\"\"Create arc shaped region with coordinates x1,y1,x2,y2.\"\"\" return self._create('arc', args, kw) def create_bitmap(self, *args, **kw): \"\"\"Create bitmap with coordinates x1,y1.\"\"\" return self._create('bitmap', args, kw) def create_image(self, *args, **kw): \"\"\"Create image item with coordinates x1,y1.\"\"\" return self._create('image', args, kw) def create_line(self, *args, **kw): \"\"\"Create line with coordinates x1,y1,...,xn,yn.\"\"\" return self._create('line', args, kw) def create_oval(self, *args, **kw): \"\"\"Create oval with coordinates x1,y1,x2,y2.\"\"\" return self._create('oval', args, kw) def create_polygon(self, *args, **kw): \"\"\"Create polygon with coordinates x1,y1,...,xn,yn.\"\"\" return self._create('polygon', args, kw) def create_rectangle(self, *args, **kw): \"\"\"Create rectangle with coordinates x1,y1,x2,y2.\"\"\" return self._create('rectangle', args, kw) def create_text(self, *args, **kw): \"\"\"Create text with coordinates x1,y1.\"\"\" return self._create('text', args, kw) def create_window(self, *args, **kw): \"\"\"Create window with coordinates x1,y1,x2,y2.\"\"\" return self._create('window', args, kw) def dchars(self, *args): \"\"\"Delete characters of text items identified by tag or id in ARGS (possibly several times) from FIRST to LAST character (including).\"\"\" self.tk.call((self._w, 'dchars') + args) def delete(self, *args): \"\"\"Delete items identified by all tag or ids contained in ARGS.\"\"\" self.tk.call((self._w, 'delete') + args) def dtag(self, *args): \"\"\"Delete tag or id given as last arguments in ARGS from items identified by first argument in ARGS.\"\"\" self.tk.call((self._w, 'dtag') + args) def find(self, *args): \"\"\"Internal function.\"\"\" return self._getints( self.tk.call((self._w, 'find') + args)) or () def find_above(self, tagOrId): \"\"\"Return items above TAGORID.\"\"\" return self.find('above', tagOrId) def find_all(self): \"\"\"Return all items.\"\"\" return self.find('all') def find_below(self, tagOrId): \"\"\"Return all items below TAGORID.\"\"\" return self.find('below', tagOrId) def find_closest(self, x, y, halo=None, start=None): \"\"\"Return item which is closest to pixel at X, Y. If several match take the top-most. All items closer than HALO are considered overlapping (all are closest). If START is specified the next below this tag is taken.\"\"\" return self.find('closest', x, y, halo, start) def find_enclosed(self, x1, y1, x2, y2): \"\"\"Return all items in rectangle defined by X1,Y1,X2,Y2.\"\"\" return self.find('enclosed', x1, y1, x2, y2) def find_overlapping(self, x1, y1, x2, y2): \"\"\"Return all items which overlap the rectangle defined by X1,Y1,X2,Y2.\"\"\" return self.find('overlapping', x1, y1, x2, y2) def find_withtag(self, tagOrId): \"\"\"Return all items with TAGORID.\"\"\" return self.find('withtag', tagOrId) def focus(self, *args): \"\"\"Set focus to the first item specified in ARGS.\"\"\" return self.tk.call((self._w, 'focus') + args) def gettags(self, *args): \"\"\"Return tags associated with the first item specified in ARGS.\"\"\" return self.tk.splitlist( self.tk.call((self._w, 'gettags') + args)) def icursor(self, *args): \"\"\"Set cursor at position POS in the item identified by TAGORID. In ARGS TAGORID must be first.\"\"\" self.tk.call((self._w, 'icursor') + args) def index(self, *args): \"\"\"Return position of cursor as integer in item specified in ARGS.\"\"\" return self.tk.getint(self.tk.call((self._w, 'index') + args)) def insert(self, *args): \"\"\"Insert TEXT in item TAGORID at position POS. ARGS must be TAGORID POS TEXT.\"\"\" self.tk.call((self._w, 'insert') + args) def itemcget(self, tagOrId, option): \"\"\"Return the value of OPTION for item TAGORID.\"\"\" return self.tk.call( (self._w, 'itemcget') + (tagOrId, '-'+option)) def itemconfigure(self, tagOrId, cnf=None, **kw): \"\"\"Query or modify the configuration options of an item TAGORID. Similar to configure() except that it applies to the specified item. \"\"\" return self._configure(('itemconfigure', tagOrId), cnf, kw) itemconfig = itemconfigure # lower, tkraise/lift hide Misc.lower, Misc.tkraise/lift, # so the preferred name for them is tag_lower, tag_raise # (similar to tag_bind, and similar to the Text widget); # unfortunately can't delete the old ones yet (maybe in 1.6) def tag_lower(self, *args): \"\"\"Lower an item TAGORID given in ARGS (optional below another item).\"\"\" self.tk.call((self._w, 'lower') + args) lower = tag_lower def move(self, *args): \"\"\"Move an item TAGORID given in ARGS.\"\"\" self.tk.call((self._w, 'move') + args) def moveto(self, tagOrId, x='', y=''): \"\"\"Move the items given by TAGORID in the canvas coordinate space so that the first coordinate pair of the bottommost item with tag TAGORID is located at position (X,Y). X and Y may be the empty string, in which case the corresponding coordinate will be unchanged. All items matching TAGORID remain in the same positions relative to each other.\"\"\" self.tk.call(self._w, 'moveto', tagOrId, x, y) def postscript(self, cnf={}, **kw): \"\"\"Print the contents of the canvas to a postscript file. Valid options: colormap, colormode, file, fontmap, height, pageanchor, pageheight, pagewidth, pagex, pagey, rotate, width, x, y.\"\"\" return self.tk.call((self._w, 'postscript') + self._options(cnf, kw)) def tag_raise(self, *args): \"\"\"Raise an item TAGORID given in ARGS (optional above another item).\"\"\" self.tk.call((self._w, 'raise') + args) lift = tkraise = tag_raise def scale(self, *args): \"\"\"Scale item TAGORID with XORIGIN, YORIGIN, XSCALE, YSCALE.\"\"\" self.tk.call((self._w, 'scale') + args) def scan_mark(self, x, y): \"\"\"Remember the current X, Y coordinates.\"\"\" self.tk.call(self._w, 'scan', 'mark', x, y) def scan_dragto(self, x, y, gain=10): \"\"\"Adjust the view of the canvas to GAIN times the difference between X and Y and the coordinates given in scan_mark.\"\"\" self.tk.call(self._w, 'scan', 'dragto', x, y, gain) def select_adjust(self, tagOrId, index): \"\"\"Adjust the end of the selection near the cursor of an item TAGORID to index.\"\"\" self.tk.call(self._w,