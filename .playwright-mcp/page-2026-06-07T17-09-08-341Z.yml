ch is nearest to y coordinate Y.\"\"\" return self.tk.getint(self.tk.call( self._w, 'nearest', y)) def scan_mark(self, x, y): \"\"\"Remember the current X, Y coordinates.\"\"\" self.tk.call(self._w, 'scan', 'mark', x, y) def scan_dragto(self, x, y): \"\"\"Adjust the view of the listbox to 10 times the difference between X and Y and the coordinates given in scan_mark.\"\"\" self.tk.call(self._w, 'scan', 'dragto', x, y) def see(self, index): \"\"\"Scroll such that INDEX is visible.\"\"\" self.tk.call(self._w, 'see', index) def selection_anchor(self, index): \"\"\"Set the fixed end oft the selection to INDEX.\"\"\" self.tk.call(self._w, 'selection', 'anchor', index) select_anchor = selection_anchor def selection_clear(self, first, last=None): \"\"\"Clear the selection from FIRST to LAST (included).\"\"\" self.tk.call(self._w, 'selection', 'clear', first, last) select_clear = selection_clear def selection_includes(self, index): \"\"\"Return True if INDEX is part of the selection.\"\"\" return self.tk.getboolean(self.tk.call( self._w, 'selection', 'includes', index)) select_includes = selection_includes def selection_set(self, first, last=None): \"\"\"Set the selection from FIRST to LAST (included) without changing the currently selected elements.\"\"\" self.tk.call(self._w, 'selection', 'set', first, last) select_set = selection_set def size(self): \"\"\"Return the number of elements in the listbox.\"\"\" return self.tk.getint(self.tk.call(self._w, 'size')) def itemcget(self, index, option): \"\"\"Return the value of OPTION for item at INDEX.\"\"\" return self.tk.call( (self._w, 'itemcget') + (index, '-'+option)) def itemconfigure(self, index, cnf=None, **kw): \"\"\"Query or modify the configuration options of an item at INDEX. Similar to configure() except that it applies to the specified item. \"\"\" return self._configure(('itemconfigure', index), cnf, kw) itemconfig = itemconfigure class Menu(Widget): \"\"\"Menu widget which allows displaying menu bars, pull-down menus and pop-up menus.\"\"\" def __init__(self, master=None, cnf={}, **kw): \"\"\"Construct menu widget with the parent MASTER. Valid option names: activebackground, activeborderwidth, activeforeground, background, bd, bg, borderwidth, cursor, disabledforeground, fg, font, foreground, postcommand, relief, selectcolor, takefocus, tearoff, tearoffcommand, title, type.\"\"\" Widget.__init__(self, master, 'menu', cnf, kw) def tk_popup(self, x, y, entry=\"\"): \"\"\"Post the menu at position X,Y with entry ENTRY.\"\"\" self.tk.call('tk_popup', self._w, x, y, entry) def activate(self, index): \"\"\"Activate entry at INDEX.\"\"\" self.tk.call(self._w, 'activate', index) def add(self, itemType, cnf={}, **kw): \"\"\"Internal function.\"\"\" self.tk.call((self._w, 'add', itemType) + self._options(cnf, kw)) def add_cascade(self, cnf={}, **kw): \"\"\"Add hierarchical menu item.\"\"\" self.add('cascade', cnf or kw) def add_checkbutton(self, cnf={}, **kw): \"\"\"Add checkbutton menu item.\"\"\" self.add('checkbutton', cnf or kw) def add_command(self, cnf={}, **kw): \"\"\"Add command menu item.\"\"\" self.add('command', cnf or kw) def add_radiobutton(self, cnf={}, **kw): \"\"\"Add radio menu item.\"\"\" self.add('radiobutton', cnf or kw) def add_separator(self, cnf={}, **kw): \"\"\"Add separator.\"\"\" self.add('separator', cnf or kw) def insert(self, index, itemType, cnf={}, **kw): \"\"\"Internal function.\"\"\" self.tk.call((self._w, 'insert', index, itemType) + self._options(cnf, kw)) def insert_cascade(self, index, cnf={}, **kw): \"\"\"Add hierarchical menu item at INDEX.\"\"\" self.insert(index, 'cascade', cnf or kw) def insert_checkbutton(self, index, cnf={}, **kw): \"\"\"Add checkbutton menu item at INDEX.\"\"\" self.insert(index, 'checkbutton', cnf or kw) def insert_command(self, index, cnf={}, **kw): \"\"\"Add command menu item at INDEX.\"\"\" self.insert(index, 'command', cnf or kw) def insert_radiobutton(self, index, cnf={}, **kw): \"\"\"Add radio menu item at INDEX.\"\"\" self.insert(index, 'radiobutton', cnf or kw) def insert_separator(self, index, cnf={}, **kw): \"\"\"Add separator at INDEX.\"\"\" self.insert(index, 'separator', cnf or kw) def delete(self, index1, index2=None): \"\"\"Delete menu items between INDEX1 and INDEX2 (included).\"\"\" if index2 is None: index2 = index1 num_index1, num_index2 = self.index(index1), self.index(index2) if (num_index1 is None) or (num_index2 is None): num_index1, num_index2 = 0, -1 for i in range(num_index1, num_index2 + 1): if 'command' in self.entryconfig(i): c = str(self.entrycget(i, 'command')) if c: self.deletecommand(c) self.tk.call(self._w, 'delete', index1, index2) def entrycget(self, index, option): \"\"\"Return the value of OPTION for a menu item at INDEX.\"\"\" return self.tk.call(self._w, 'entrycget', index, '-' + option) def entryconfigure(self, index, cnf=None, **kw): \"\"\"Query or modify the configuration options of a menu item at INDEX. Similar to configure() except that it applies to the specified menu item. \"\"\" return self._configure(('entryconfigure', index), cnf, kw) entryconfig = entryconfigure def index(self, index): \"\"\"Return the index of a menu item identified by INDEX.\"\"\" i = self.tk.call(self._w, 'index', index) return None if i in ('', 'none') else self.tk.getint(i) # GH-103685. def invoke(self, index): \"\"\"Invoke a menu item identified by INDEX and execute the associated command.\"\"\" return self.tk.call(self._w, 'invoke', index) def post(self, x, y): \"\"\"Display a menu at position X,Y.\"\"\" self.tk.call(self._w, 'post', x, y) def type(self, index): \"\"\"Return the type of the menu item at INDEX.\"\"\" return self.tk.call(self._w, 'type', index) def unpost(self): \"\"\"Unmap a menu.\"\"\" self.tk.call(self._w, 'unpost') def xposition(self, index): # new in Tk 8.5 \"\"\"Return the x-position of the leftmost pixel of the menu item at INDEX.\"\"\" return self.tk.getint(self.tk.call(self._w, 'xposition', index)) def yposition(self, index): \"\"\"Return the y-position of the topmost pixel of the menu item at INDEX.\"\"\" return self.tk.getint(self.tk.call( self._w, 'yposition', index)) class Menubutton(Widget): \"\"\"Menubutton widget, obsolete since Tk8.0.\"\"\" def __init__(self, master=None, cnf={}, **kw): Widget.__init__(self, master, 'menubutton', cnf, kw) class Message(Widget): \"\"\"Message widget to display multiline text. Obsolete since Label does it too.\"\"\" def __init__(self, master=None, cnf={}, **kw): Widget.__init__(self, master, 'message', cnf, kw) class Radiobutton(Widget): \"\"\"Radiobutton widget which shows only one of several buttons in on-state.\"\"\" def __init__(self, master=None, cnf={}, **kw): \"\"\"Construct a radiobutton widget with the parent MASTER. Valid option names: activebackground, activeforeground, anchor, background, bd, bg, bitmap, borderwidth, command, cursor, disabledforeground, fg, font, foreground, height, highlightbackground, highlightcolor, highlightthickness, image, indicatoron, justify, padx, pady, relief, selectcolor, selectimage, state, takefocus, text, textvariable, underline, value, variable, width, wraplength.\"\"\" Widget.__init__(self, master, 'radiobutton', cnf, kw) def deselect(self): \"\"\"Put the button in off-state.\"\"\" self.tk.call(self._w, 'deselect') def flash(self): \"\"\"Flash the button.\"\"\" self.tk.call(self._w, 'flash') def invoke(self): \"\"\"Toggle the button and invoke a command if given as option.\"\"\" return self.tk.call(self._w, 'invoke') def select(self): \"\"\"Put the button in on-state.\"\"\" self.tk.call(self._w, 'select') class Scale(Widget): \"\"\"Scale widget which can display a numerical scale.\"\"\" def __init__(self, master=None, cnf={}, **kw): \"\"\"Construct a scale widget with the parent MASTER. Valid option names: activebackground, background, bigincrement, bd, bg, borderwidth, command, cursor, digits, fg, font, foreground, from, highlightbackground, highlightcolor, highlightthickness, label, length, orient, relief, repeatdelay, repeatinterval, resolution, showvalue, sliderlength, sliderrelief, state, takefocus, tickinterval, to, troughcolor, variable, width.\"\"\" Widget.__init__(self, master, 'scale', cnf, kw) def get(self): \"\"\"Get the current value as integer or float.\"\"\" value = self.tk.call(self._w, 'get') try: return self.tk.getint(value) except (ValueError, TypeError, TclError): return self.tk.getdouble(value) def set(self, value): \"\"\"Set the value to VALUE.\"\"\" self.tk.call(self._w, 'set', value) def coords(self, value=None): \"\"\"Return a tuple (X,Y) of the point along the centerline of the trough that corresponds to VALUE or the current value if None is given.\"\"\" return self._getints(self.tk.call(self._w, 'coords', value)) def identify(self, x, y): \"\"\"Return where the point X,Y lies. Valid return values are \"slider\", \"though1\" and \"though2\".\"\"\" return self.tk.call(self._w, 'identify', x, y) class Scrollbar(Widget): \"\"\"Scrollbar widget which displays a slider at a certain position.\"\"\" def __init__(self, master=None, cnf={}, **kw): \"\"\"Construct a scrollbar widget with the parent MASTER. Valid option names: activebackground, activerelief, background, bd, bg, borderwidth, command, cursor, elementborderwidth, highlightbackground, highlightcolor, highlightthickness, jump, orient, relief, repeatdelay, repeatinterval, takefocus, troughcolor, width.\"\"\" Widget.__init__(self, master, 'scrollbar', cnf, kw) def activate(self, index=None): \"\"\"Marks the element indicated by index as active. The only index values understood by this method are \"arrow1\", \"slider\", or \"arrow2\". If any other value is specified then no element of the scrollbar will be active. If index is not specified, the method returns the name of the element that is currently active, or None if no element is active.\"\"\" return self.tk.call(self._w, 'activate', index) or None def delta(self, deltax, deltay): \"\"\"Return the fractional change of the scrollbar setting if it would be moved by DELTAX or DELTAY pixels.\"\"\" return self.tk.getdouble( self.tk.call(self._w, 'delta', deltax, deltay)) def fraction(self, x, y): \"\"\"Return the fractional value which corresponds to a slider position of X,Y.\"\"\" return self.tk.getdouble(self.tk.call(self._w, 'fraction', x, y)) def identify(self, x, y): \"\"\"Return the element under position X,Y as one of \"arrow1\",\"slider\",\"arrow2\" or \"\".\"\"\" return self.tk.call(self._w, 'identify', x, y) def get(self): \"\"\"Return the current fractional values (upper and lower end) of the slider position.\"\"\" return self._getdoubles(self.tk.call(self._w, 'get')) def set(self, first, last): \"\"\"Set the fractional values of the slider position (upper and lower ends as value between 0 and 1).\"\"\" self.tk.call(self._w, 'set', first, last) class Text(Widget, XView, YView): \"\"\"Text widget which can display text in various forms.\"\"\" def __init__(self, master=None, cnf={}, **kw): \"\"\"Construct a text widget with the parent MASTER. STANDARD OPTIONS background, borderwidth, cursor, exportselection, font, foreground, highlightbackground, highlightcolor, highlightthickness, insertbackground, insertborderwidth, insertofftime, insertontime, insertwidth, padx, pady, relief, selectbackground, selectborderwidth, selectforeground, setgrid, takefocus, xscrollcommand, yscrollcommand, WIDGET-SPECIFIC OPTIONS autoseparators, height, maxundo, spacing1, spacing2, spacing3, state, tabs, undo, width, wrap, \"\"\" Widget.__init__(self, master, 'text', cnf, kw) def bbox(self, index): \"\"\"Return a tuple of (x,y,width,height) which gives the bounding box of the visible part of the character at the given index.\"\"\" return self._getints( self.tk.call(self._w, 'bbox', index)) or None def compare(self, index1, op, index2): \"\"\"Return whether between index INDEX1 and index INDEX2 the relation OP is satisfied. OP is one of <, <=, ==, >=, >, or !=.\"\"\" return self.tk.getboolean(self.tk.call( self._w, 'compare', index1, op, index2)) def count(self, index1, index2, *options, return_ints=False): # new in Tk 8.5 \"\"\"Counts the number of relevant things between the two indices. If INDEX1 is after INDEX2, the result will be a negative number (and this holds for each of the possible options). The actual items which are counted depends on the options given. The result is a tuple of integers, one for the result of each counting option given, if more than one option is specified or return_ints is false (default), otherwise it is an integer. Valid counting options are \"chars\", \"displaychars\", \"displayindices\", \"displaylines\", \"indices\", \"lines\", \"xpixels\" and \"ypixels\". The default value, if no option is specified, is \"indices\". There is an additional possible option \"update\", which if given then all subsequent options ensure that any possible out of date information is recalculated. \"\"\" options = ['-%s' % arg for arg in options] res = self.tk.call(self._w, 'count', *options, index1, index2) if not isinstance(res, int): res = self._getints(res) if len(res) == 1: res, = res if not return_ints: if not res: res = None elif len(options) <= 1: res = (res,) return res def debug(self, boolean=None): \"\"\"Turn on the internal consistency checks of the B-Tree inside the text widget according to BOOLEAN.\"\"\" if boolean is None: return self.tk.getboolean(self.tk.call(self._w, 'debug')) self.tk.call(self._w, 'debug', boolean) def delete(self, index1, index2=None): \"\"\"Delete the characters between INDEX1 and INDEX2 (not included).\"\"\" self.tk.call(self._w, 'delete', index1, index2) def dlineinfo(self, index): \"\"\"Return tuple (x,y,width,height,baseline) giving the bounding box and baseline position of the visible part of the line containing the character at INDEX.\"\"\" return self._getints(self.tk.call(self._w, 'dlineinfo', index)) def dump(self, index1, index2=None, command=None, **kw): \"\"\"Return the contents of the widget between index1 and index2. The type of contents returned in filtered based on the keyword parameters; if 'all', 'image', 'mark', 'tag', 'text', or 'window' are given and true, then the corresponding items are returned. The result is a list of triples of the form (key, value, index). If none of the keywords are true then 'all' is used by default. If the 'command' argument is given, it is called once for each element of the list of triples, with the values of each triple serving as the arguments to the function. In this case the list is not returned.\"\"\" args = [] func_name = None result = None if not command: # Never call the dump command without the -command flag, since the # output could involve Tcl quoting and would be a pain to parse # right. Instead just set the command to build a list of triples # as if we had done the parsing. result = [] def append_triple(key, value, index, result=result): result.append((key, value, index)) command = append_triple try: if not isinstance(command, str): func_name = command = self._register(command) args += [\"-command\", command] for key in kw: if kw[key]: args.append(\"-\" + key) args.append(index1) if index2: args.append(index2) self.tk.call(self._w, \"dump\", *args) return result finally: if func_name: self.deletecommand(func_name) ## new in tk8.4 def edit(self, *args): \"\"\"Internal method This method controls the undo mechanism and the modified flag. The exact behavior of the command depends on the option argument that follows the edit argument. The following forms of the command are currently supported: edit_modified, edit_redo, edit_reset, edit_separator and edit_undo \"\"\" return self.tk.call(self._w, 'edit', *args) def edit_modified(self, arg=None): \"\"\"Get or Set the modified flag If arg is not specified, returns the modified flag of the widget. The insert, delete, edit undo and edit redo commands or the user can set or clear the modified flag. If boolean is specified, sets the modified flag of the widget to arg. \"\"\" return self.edit(\"modified\", arg) def edit_redo(self): \"\"\"Redo the last undone edit When the undo option is true, reapplies the last undone edits provided no other edits were done since then. Generates an error when the redo stack is empty. Does nothing when the undo option is false. \"\"\" return self.edit(\"redo\") def edit_reset(self): \"\"\"Clears the undo and redo stacks \"\"\" return self.edit(\"reset\") def edit_separator(self): \"\"\"Inserts a separator (boundary) on the undo stack. Does nothing when the undo option is false \"\"\" return self.edit(\"separator\") def edit_undo(self): \"\"\"Undoes the last edit action If the undo option is true. An edit action is defined as all the insert and delete commands that are recorded on the undo stack in between two separators. Generates an error when the undo stack is empty. Does nothing when the undo option is false \"\"\" return self.edit(\"undo\") def get(self, index1, index2=None): \"\"\"Return the text from INDEX1 to INDEX2 (not included).\"\"\" return self.tk.call(self._w, 'get', index1, index2) # (Image commands are new in 8.0) def image_cget(self, index, option): \"\"\"Return the value of OPTION of an embedded image at INDEX.\"\"\" if option[:1] != \"-\": option = \"-\" + option if option[-1:] == \"_\": option = option[:-1] return self.tk.call(self._w, \"image\", \"cget\", index, option) def image_configure(self, index, cnf=None, **kw): \"\"\"Query or modify the configuration options of an embedded image at INDEX. Similar to configure() except that it applies to the specified embedded image. \"\"\" return self._configure(('image', 'configure', index), cnf, kw) def image_create(self, index, cnf={}, **kw): \"\"\"Create an embedded image at INDEX.\"\"\" return self.tk.call( self._w, \"image\", \"create\", index, *self._options(cnf, kw)) def image_names(self): \"\"\"Return all names of embedded images in this widget.\"\"\" return self.tk.call(self._w, \"image\", \"names\") def index(self, index): \"\"\"Return the index in the form line.char for INDEX.\"\"\" return str(self.tk.call(self._w, 'index', index)) def insert(self, index, chars, *args): \"\"\"Insert CHARS before the characters at INDEX. An additional tag can be given in ARGS. Additional CHARS and tags can follow in ARGS.\"\"\" self.tk.call((self._w, 'insert', index, chars) + args) def mark_gravity(self, markName, direction=None): \"\"\"Change the gravity of a mark MARKNAME to DIRECTION (LEFT or RIGHT). Return the current value if None is given for DIRECTION.\"\"\" return self.tk.call( (self._w, 'mark', 'gravity', markName, direction)) def mark_names(self): \"\"\"Return all mark names.\"\"\" return self.tk.splitlist(self.tk.call( self._w, 'mark', 'names')) def mark_set(self, markName, index): \"\"\"Set mark MARKNAME before the character at INDEX.\"\"\" self.tk.call(self._w, 'mark', 'set', markName, index) def mark_unset(self, *markNames): \"\"\"Delete all marks in MARKNAMES.\"\"\" self.tk.call((self._w, 'mark', 'unset') + markNames) def mark_next(self, index): \"\"\"Return the name of the next mark after INDEX.\"\"\" return self.tk.call(self._w, 'mark', 'next', index) or None def mark_previous(self, index): \"\"\"Return the name of the previous mark before INDEX.\"\"\" return self.tk.call(self._w, 'mark', 'previous', index) or None def peer_create(self, newPathName, cnf={}, **kw): # new in Tk 8.5 \"\"\"Creates a peer text widget with the given newPathName, and any optional standard configuration options. By default the peer will have the same start and end line as the parent widget, but these can be overridden with the standard configuration options.\"\"\" self.tk.call(self._w, 'peer', 'create', newPathName, *self._options(cnf, kw)) def peer_names(self): # new in Tk 8.5 \"\"\"Returns a list of peers of this widget (this does not include the widget itself).\"\"\" return self.tk.splitlist(self.tk.call(self._w, 'peer', 'names')) def replace(self, index1, index2, chars, *args): # new in Tk 8.5 \"\"\"Replaces the range of characters between index1 and index2 with the given characters and tags specified by args. See the method insert for some more information about args, and the method delete for information about the indices.\"\"\" self.tk.call(self._w, 'replace', index1, index2, chars, *args) def scan_mark(self, x, y): \"\"\"Remember the current X, Y coordinates.\"\"\" self.tk.call(self._w, 'scan', 'mark', x, y) def scan_dragto(self, x, y): \"\"\"Adjust the view of the text to 10 times the difference between X and Y and the coordinates given in scan_mark.\"\"\" self.tk.call(self._w, 'scan', 'dragto', x, y) def search(self, pattern, index, stopindex=None, forwards=None, backwards=None, exact=None, regexp=None, nocase=None, count=None, elide=None, *, nolinestop=None, strictlimits=None): \"\"\"Search PATTERN beginning from INDEX until STOPINDEX. Return the index of the first character of a match or an empty string.\"\"\" args = [self._w, 'search'] if forwards: args.append('-forwards') if backwards: args.append('-backwards') if exact: args.append('-exact') if regexp: args.append('-regexp') if nocase: args.append('-nocase') if elide: args.append('-elide') if count: args.append('-count'); args.append(count) if nolinestop: args.append('-nolinestop') if strictlimits: args.append('-strictlimits') if pattern and pattern[0] == '-': args.append('--') args.append(pattern) args.append(index) if stopindex is not None: args.append(stopindex) return str(self.tk.call(tuple(args))) def search_all(self, pattern, index, stopindex=None, *, forwards=None, backwards=None, exact=None, regexp=None, nocase=None, count=None, elide=None, nolinestop=None, overlap=None, strictlimits=None): \"\"\"Search all occurrences of PATTERN from INDEX to STOPINDEX. Return a tuple of indices where matches begin.\"\"\" args = [self._w, 'search', '-all'] if forwards: args.append('-forwards') if backwards: args.append('-backwards') if exact: args.append('-exact') if regexp: args.append('-regexp') if nocase: args.append('-nocase') if elide: args.append('-elide') if count: args.append('-count'); args.append(count) if nolinestop: args.append('-nolinestop') if overlap: args.append('-overlap') if strictlimits: args.append('-strictlimits') if pattern and pattern[0] == '-': args.append('--') args.append(pattern) args.append(index) if stopindex is not None: args.append(stopindex) result = self.tk.call(tuple(args)) return self.tk.splitlist(result) def see(self, index): \"\"\"Scroll such that the character at INDEX is visible.\"\"\" self.tk.call(self._w, 'see', index) def tag_add(self, tagName, index1, *args): \"\"\"Add tag TAGNAME to all characters between INDEX1 and index2 in ARGS. Additional pairs of indices may follow in ARGS.\"\"\" self.tk.call( (self._w, 'tag', 'add', tagName, index1) + args) def tag_unbind(self, tagName, sequence, funcid=None): \"\"\"Unbind for all characters with TAGNAME for event SEQUENCE the function identified with FUNCID.\"\"\" return self._unbind((self._w, 'tag', 'bind', tagName, sequence), funcid) def tag_bind(self, tagName, sequence, func, add=None): \"\"\"Bind to all characters with TAGNAME at event SEQUENCE a call to function FUNC. An additional boolean parameter ADD specifies whether FUNC will be called additionally to the other bound function or whether it will replace the previous function. See bind for the return value.\"\"\" return self._bind((self._w, 'tag', 'bind', tagName), sequence, func, add) def _tag_bind(self, tagName, sequence=None, func=None, add=None): # For tests only return self._bind((self._w, 'tag', 'bind', tagName), sequence, func, add) def tag_cget(self, tagName, option): \"\"\"Return the value of OPTION for tag TAGNAME.\"\"\" if option[:1] != '-': option = '-' + option if option[-1:] == '_': option = option[:-1] return self.tk.call(self._w, 'tag', 'cget', tagName, option) def tag_configure(self, tagName, cnf=None, **kw): \"\"\"Query or modify the configuration options of a tag TAGNAME. Similar to configure() except that it applies to the specified tag. \"\"\" return self._configure(('tag', 'configure', tagName), cnf, kw) tag_config = tag_configure def tag_delete(self, *tagNames): \"\"\"Delete all tags in TAGNAMES.\"\"\" self.tk.call((self._w, 'tag', 'delete') + tagNames) def tag_lower(self, tagName, belowThis=None): \"\"\"Change the priority of tag TAGNAME such that it is lower than the priority of BELOWTHIS.\"\"\" self.tk.call(self._w, 'tag', 'lower', tagName, belowThis) def tag_names(self, index=None): \"\"\"Return a list of all tag names.\"\"\" return self.tk.splitlist( self.tk.call(self._w, 'tag', 'names', index)) def tag_nextrange(self, tagName, index1, index2=None): \"\"\"Return a list of start and end index for the first sequence of characters between INDEX1 and INDEX2 which all have tag TAGNAME. The text is searched forward from INDEX1.\"\"\" return self.tk.splitlist(self.tk.call( self._w, 'tag', 'nextrange', tagName, index1, index2)) def tag_prevrange(self, tagName, index1, index2=None): \"\"\"Return a list of start and end index for the first sequence of characters between INDEX1 and INDEX2 which all have tag TAGNAME. The text is searched backwards from INDEX1.\"\"\" return self.tk.splitlist(self.tk.call( self._w, 'tag', 'prevrange', tagName, index1, index2)) def tag_raise(self, tagName, aboveThis=None): \"\"\"Change the priority of tag TAGNAME such that it is higher than the priority of ABOVETHIS.\"\"\" self.tk.call( self._w, 'tag', 'raise', tagName, aboveThis) def tag_ranges(self, tagName): \"\"\"Return a list of ranges of text which have tag TAGNAME.\"\"\" return self.tk.splitlist(self.tk.call( self._w, 'tag', 'ranges', tagName)) def tag_remove(self, tagName, index1, index2=None): \"\"\"Remove tag TAGNAME from all characters between INDEX1 and INDEX2.\"\"\" self.tk.call( self._w, 'tag', 'remove', tagName, index1, index2) def window_cget(self, index, option): \"\"\"Return the value of OPTION of an embedded window at INDEX.\"\"\" if option[:1] != '-': option = '-' + option if option[-1:] == '_': option = option[:-1] return self.tk.call(self._w, 'window', 'cget', index, option) def window_configure(self, index, cnf=None, **kw): \"\"\"Query or modify the configuration options of an embedded window at INDEX. Similar to configure() except that it applies to the specified embedded window. \"\"\" return self._configure(('window', 'configure', index), cnf, kw) window_config = window_configure def window_create(self, index, cnf={}, **kw): \"\"\"Create a window at INDEX.\"\"\" self.tk.call( (self._w, 'window', 'create', index) + self._options(cnf, kw)) def window_names(self): \"\"\"Return all names of embedded windows in this widget.\"\"\" return self.tk.splitlist( self.tk.call(self._w, 'window', 'names')) def yview_pickplace(self, *what): \"\"\"Obsolete function, use see.\"\"\" self.tk.call((self._w, 'yview', '-pickplace') + what) class _setit: \"\"\"Internal class. It wraps the command in the widget OptionMenu.\"\"\" def __init__(self, var, value, callback=None): self.__value = value self.__var = var self.__callback = callback def __call__(self, *args): self.__var.set(self.__value) if self.__callback is not None: self.__callback(self.__value, *args) class OptionMenu(Menubutton): \"\"\"OptionMenu which allows the user to select a value from a menu.\"\"\" def __init__(self, master, variable, value, *values, **kwargs): \"\"\"Construct an optionmenu widget with the parent MASTER, with the option textvariable set to VARIABLE, the initially selected value VALUE, the other menu values VALUES and an additional keyword argument command.\"\"\" kw = {\"borderwidth\": 2, \"textvariable\": variable, \"indicatoron\": 1, \"relief\": RAISED, \"anchor\": \"c\", \"highlightthickness\": 2, \"name\": kwargs.pop(\"name\", None)} Widget.__init__(self, master, \"menubutton\", kw) self.widgetName = 'tk_optionMenu' menu = self.__menu = Menu(self, name=\"menu\", tearoff=0) self.menuname = menu._w # 'command' is the only supported keyword callback = kwargs.get('command') if 'command' in kwargs: del kwargs['command'] if kwargs: raise TclError('unknown option -'+next(iter(kwargs))) menu.add_command(label=value, command=_setit(variable, value, callback)) for v in values: menu.add_command(label=v, command=_setit(variable, v, callback)) self[\"menu\"] = menu def __getitem__(self, name): if name == 'menu': return self.__menu return Widget.__getitem__(self, name) def destroy(self): \"\"\"Destroy this widget and the associated menu.\"\"\" Menubutton.destroy(self) self.__menu = None class Image: \"\"\"Base class for images.\"\"\" _last_id = 0 def __init__(self, imgtype, name=None, cnf={}, master=None, **kw): self.name = None if master is None: master = _get_default_root('create image') self.tk = getattr(master, 'tk', master) if not name: Image._last_id += 1 name = \"pyimage%r\" % (Image._last_id,) # tk itself would use image<x> if kw and cnf: cnf = _cnfmerge((cnf, kw)) elif kw: cnf = kw options = () for k, v in cnf.items(): options = options + ('-'+k, v) self.tk.call(('image', 'create', imgtype, name,) + options) self.name = name def __str__(self): return self.name def __del__(self): if self.name: try: self.tk.call('image', 'delete', self.name) except TclError: # May happen if the root was destroyed pass def __setitem__(self, key, value): self.tk.call(self.name, 'configure', '-'+key, value) def __getitem__(self, key): return self.tk.call(self.name, 'configure', '-'+key) __iter__ = None # prevent using __getitem__ for iteration def configure(self, **kw): \"\"\"Configure the image.\"\"\" res = () for k, v in _cnfmerge(kw).items(): if v is not None: if k[-1] == '_': k = k[:-1] res = res + ('-'+k, v) self.tk.call((self.name, 'config') + res) config = configure def height(self): \"\"\"Return the height of the image.\"\"\" return self.tk.getint( self.tk.call('image', 'height', self.name)) def type(self): \"\"\"Return the type of the image, e.g. \"photo\" or \"bitmap\".\"\"\" return self.tk.call('image', 'type', self.name) def width(self): \"\"\"Return the width of the image.\"\"\" return self.tk.getint( self.tk.call('image', 'width', self.name)) class PhotoImage(Image): \"\"\"Widget which can display images in PGM, PPM, GIF, PNG format.\"\"\" def __init__(self, name=None, cnf={}, master=None, **kw): \"\"\"Create an image with NAME. Valid option names: data, format, file, gamma, height, palette, width.\"\"\" Image.__init__(self, 'photo', name, cnf, master, **kw) def blank(self): \"\"\"Display a transparent image.\"\"\" self.tk.call(self.name, 'blank') def cget(self, option): \"\"\"Return the value of OPTION.\"\"\" return self.tk.call(self.name, 'cget', '-' + option) # XXX config def __getitem__(self, key): return self.tk.call(self.name, 'cget', '-' + key) def copy(self, *, from_coords=None, zoom=None, subsample=None): \"\"\"Return a new PhotoImage with the same image as this widget. The FROM_COORDS option specifies a rectangular sub-region of the source image to be copied. It must be a tuple or a list of 1 to 4 integers (x1, y1, x2, y2). (x1, y1) and (x2, y2) specify diagonally opposite corners of the rectangle. If x2 and y2 are not specified, the default value is the bottom-right corner of the source image. The pixels copied will include the left and top edges of the specified rectangle but not the bottom or right edges. If the FROM_COORDS option is not given, the default is the whole source image. If SUBSAMPLE or ZOOM are specified, the image is transformed as in the subsample() or zoom() methods. The value must be a single integer or a pair of integers. \"\"\" destImage = PhotoImage(master=self.tk) destImage.copy_replace(self, from_coords=from_coords, zoom=zoom, subsample=subsample) return destImage def zoom(self, x, y='', *, from_coords=None): \"\"\"Return a new PhotoImage with the same image as this widget but zoom it with a factor of X in the X direction and Y in the Y direction. If Y is not given, the default value is the same as X. The FROM_COORDS option specifies a rectangular sub-region of the source image to be copied, as in the copy() method. \"\"\" if y=='': y=x return self.copy(zoom=(x, y), from_coords=from_coords) def subsample(self, x, y='', *, from_coords=None): \"\"\"Return a new PhotoImage based on the same image as this widget but use only every Xth or Yth pixel. If Y is not given, the default value is the same as X. The FROM_COORDS option specifies a rectangular sub-region of the source image to be copied, as in the copy() method. \"\"\" if y=='': y=x return self.copy(subsample=(x, y), from_coords=from_coords) def copy_replace(self, sourceImage, *, from_coords=None, to=None, shrink=False, zoom=None, subsample=None, compositingrule=None): \"\"\"Copy a region from the source image (which must be a PhotoImage) to this image, possibly with pixel zooming and/or subsampling. If no options are specified, this command copies the whole of the source image into this image, starting at coordinates (0, 0). The FROM_COORDS option specifies a rectangular sub-region of the source image to be copied. It must be a tuple or a list of 1 to 4 integers (x1, y1, x2, y2). (x1, y1) and (x2, y2) specify diagonally opposite corners of the rectangle. If x2 and y2 are not specified, the default value is the bottom-right corner of the source image. The pixels copied will include the left and top edges of the specified rectangle but not the bottom or right edges. If the FROM_COORDS option is not given, the default is the whole source image. The TO option specifies a rectangular sub-region of the destination image to be affected. It must be a tuple or a list of 1 to 4 integers (x1, y1, x2, y2). (x1, y1) and (x2, y2) specify diagonally opposite corners of the rectangle. If x2 and y2 are not specified, the default value is (x1,y1) plus the size of the source region (after subsampling and zooming, if specified). If x2 and y2 are specified, the source region will be replicated if necessary to fill the destination region in a tiled fashion. If SHRINK is true, the size of the destination image should be reduced, if necessary, so that the region being copied into is at the bottom-right corner of the image. If SUBSAMPLE or ZOOM are specified, the image is transformed as in the subsample() or zoom() methods. The value must be a single integer or a pair of integers. The COMPOSITINGRULE option specifies how transparent pixels in the source image are combined with the destination image. When a compositing rule of 'overlay' is set, the old contents of the destination image are visible, as if the source image were printed on a piece of transparent film and placed over the top of the destination. When a compositing rule of 'set' is set, the old contents of the destination image are discarded and the source image is used as-is. The default compositing rule is 'overlay'. \"\"\" options = [] if from_coords is not None: options.extend(('-from', *from_coords)) if to is not None: options.extend(('-to', *to)) if shrink: options.append('-shrink') if zoom is not None: if not isinstance(zoom, (tuple, list)): zoom = (zoom,) options.extend(('-zoom', *zoom)) if subsample is not None: if not isinstance(subsample, (tuple, list)): subsample = (subsample,) options.extend(('-subsample', *subsample)) if compositingrule: options.extend(('-compositingrule', compositingrule)) self.tk.call(self.name, 'copy', sourceImage, *options) def get(self, x, y): \"\"\"Return the color (red, green, blue) of the pixel at X,Y.\"\"\" return self.tk.call(self.name, 'get', x, y) def put(self, data, to=None): \"\"\"Put row formatted colors to image starting from position TO, e.g. image.put(\"{red green} {blue yellow}\", to=(4,6))\"\"\" args = (self.name, 'put', data) if to: if to[0] == '-to': to = to[1:] args = args + ('-to',) + tuple(to) self.tk.call(args) def read(self, filename, format=None, *, from_coords=None, to=None, shrink=False): \"\"\"Reads image data from the file named FILENAME into the image. The FORMAT option specifies the format of the image data in the file. The FROM_COORDS option specifies a rectangular sub-region of the image file data to be copied to the destination image. It must be a tuple or a list of 1 to 4 integers (x1, y1, x2, y2). (x1, y1) and (x2, y2) specify diagonally opposite corners of the rectangle. If x2 and y2 are not specified, the default value is the bottom-right corner of the source image. The default, if this option is not specified, is the whole of the image in the image file. The TO option specifies the coordinates of the top-left corner of the region of the image into which data from filename are to be read. The default is (0, 0). If SHRINK is true, the size of the destination image will be reduced, if necessary, so that the region into which the image file data are read is at the bottom-right corner of the image. \"\"\" options = () if format is not None: options += ('-format', format) if from_coords is not None: options += ('-from', *from_coords) if shrink: options += ('-shrink',) if to is not None: options += ('-to', *to) self.tk.call(self.name, 'read', filename, *options) def write(self, filename, format=None, from_coords=None, *, background=None, grayscale=False): \"\"\"Writes image data from the image to a file named FILENAME. The FORMAT option specifies the name of the image file format handler to be used to write the data to the file. If this option is not given, the format is guessed from the file extension. The FROM_COORDS option specifies a rectangular region of the image to be written to the image file. It must be a tuple or a list of 1 to 4 integers (x1, y1, x2, y2). If only x1 and y1 are specified, the region extends from (x1,y1) to the bottom-right corner of the image. If all four coordinates are given, they specify diagonally opposite corners of the rectangular region. The default, if this option is not given, is the whole image. If BACKGROUND is specified, the data will not contain any transparency information. In all transparent pixels the color will be replaced by the specified color. If GRAYSCALE is true, the data will not contain color information. All pixel data will be transformed into grayscale. \"\"\" options = () if format is not None: options += ('-format', format) if from_coords is not None: options += ('-from', *from_coords) if grayscale: options += ('-grayscale',) if background is not None: options += ('-background', background) self.tk.call(self.name, 'write', filename, *options) def data(self, format=None, *, from_coords=None, background=None, grayscale=False): \"\"\"Returns image data. The FORMAT option specifies the name of the image file format handler to be used. If this option is not given, this method uses a format that consists of a tuple (one element per row) of strings containing space-separated (one element per pixel/column) colors in “#RRGGBB” format (where RR is a pair of hexadecimal digits for the red channel, GG for green, and BB for blue). The FROM_COORDS option specifies a rectangular region of the image to be returned. It must be a tuple or a list of 1 to 4 integers (x1, y1, x2, y2). If only x1 and y1 are specified, the region extends from (x1,y1) to the bottom-right corner of the image. If all four coordinates are given, they specify diagonally opposite corners of the rectangular region, including (x1, y1) and excluding (x2, y2). The default, if this option is not given, is the whole image. If BACKGROUND is specified, the data will not contain any transparency information. In all transparent pixels the color will be replaced by the specified color. If GRAYSCALE is true, the data will not contain color information. All pixel data will be transformed into grayscale. \"\"\" options = () if format is not None: options += ('-format', format) if from_coords is not None: options += ('-from', *from_coords) if grayscale: options += ('-grayscale',) if background is not None: options += ('-background', background) data = self.tk.call(self.name, 'data', *options) if isinstance(data, str): # For wantobjects = 0. if format is None: data = self.tk.splitlist(data) else: data = bytes(data, 'latin1') return data def transparency_get(self, x, y): \"\"\"Return True if the pixel at x,y is transparent.\"\"\" return self.tk.getboolean(self.tk.call( self.name, 'transparency', 'get', x, y)) def transparency_set(self, x, y, boolean): \"\"\"Set the transparency of the pixel at x,y.\"\"\" self.tk.call(self.name, 'transparency', 'set', x, y, boolean) class BitmapImage(Image): \"\"\"Widget which can display images in XBM format.\"\"\" def __init__(self, name=None, cnf={}, master=None, **kw): \"\"\"Create a bitmap with NAME. Valid option names: background, data, file, foreground, maskdata, maskfile.\"\"\" Image.__init__(self, 'bitmap', name, cnf, master, **kw) def image_names(): tk = _get_default_root('use image_names()').tk return tk.splitlist(tk.call('image', 'names')) def image_types(): tk = _get_default_root('use image_types()').tk return tk.splitlist(tk.call('image', 'types')) class Spinbox(Widget, XView): \"\"\"spinbox widget.\"\"\" def __init__(self, master=None, cnf={}, **kw): \"\"\"Construct a spinbox widget with the parent MASTER. STANDARD OPTIONS activebackground, background, borderwidth, cursor, exportselection, font, foreground, highlightbackground, highlightcolor, highlightthickness, insertbackground, insertborderwidth, insertofftime, insertontime, insertwidth, justify, relief, repeatdelay, repeatinterval, selectbackground, selectborderwidth selectforeground, takefocus, textvariable xscrollcommand. WIDGET-SPECIFIC OPTIONS buttonbackground, buttoncursor, buttondownrelief, buttonuprelief, command, disabledbackground, disabledforeground, format, from, invalidcommand, increment, readonlybackground, state, to, validate, validatecommand values, width, wrap, \"\"\" Widget.__init__(self, master, 'spinbox', cnf, kw) def bbox(self, index): \"\"\"Return a tuple of X1,Y1,X2,Y2 coordinates for a rectangle which encloses the character given by index. The first two elements of the list give the x and y coordinates of the upper-left corner of the screen area covered by the character (in pixels relative to the widget) and the last two elements give the width and height of the character, in pixels. The bounding box may refer to a region outside the visible area of the window. \"\"\" return self._getints(self.tk.call(self._w, 'bbox', index)) or None def delete(self, first, last=None): \"\"\"Delete one or more elements of the spinbox. First is the index of the first character to delete, and last is the index of the character just after the last one to delete. If last isn't specified it defaults to first+1, i.e. a single character is deleted. This command returns an empty string. \"\"\" return self.tk.call(self._w, 'delete', first, last) def get(self): \"\"\"Returns the spinbox's string\"\"\" return self.tk.call(self._w, 'get') def icursor(self, index): \"\"\"Alter the position of the insertion cursor. The insertion cursor will be displayed just before the character given by index. Returns an empty string \"\"\" return self.tk.call(self._w, 'icursor', index) def identify(self, x, y): \"\"\"Returns the name of the widget at position x, y Return value is one of: none, buttondown, buttonup, entry \"\"\" return self.tk.call(self._w, 'identify', x, y) def index(self, index): \"\"\"Returns the numerical index corresponding to index \"\"\" return self.tk.call(self._w, 'index', index) def insert(self, index, s): \"\"\"Insert string s at index Returns an empty string. \"\"\" return self.tk.call(self._w, 'insert', index, s) def invoke(self, element): \"\"\"Causes the specified element to be invoked The element could be buttondown or buttonup triggering the action associated with it. \"\"\" return self.tk.call(self._w, 'invoke', element) def scan(self, *args): \"\"\"Internal function.\"\"\" return self._getints( self.tk.call((self._w, 'scan') + args)) or () def scan_mark(self, x): \"\"\"Records x and the current view in the spinbox window; used in conjunction with later scan dragto commands. Typically this command is associated with a mouse button press in the widget. It returns an empty string. \"\"\" return self.scan(\"mark\", x) def scan_dragto(self, x): \"\"\"Compute the difference between the given x argument and the x argument to the last scan mark command It then adjusts the view left or right by 10 times the difference in x-coordinates. This command is typically associated with mouse motion events in the widget, to produce the effect of dragging the spinbox at high speed through the window. The return value is an empty string. \"\"\" return self.scan(\"dragto\", x) def selection(self, *args): \"\"\"Internal function.\"\"\" return self._getints( self.tk.call((self._w, 'selection') + args)) or () def selection_adjust(self, index): \"\"\"Locate the end of the selection nearest to the character given by index, Then adjust that end of the selection to be at index (i.e including but not going beyond index). The other end of the selection is made the anchor point for future select to commands. If the selection isn't currently in the spinbox, then a new selection is created to include the characters between index and the most recent selection anchor point, inclusive. \"\"\" return self.selection(\"adjust\", index) def selection_clear(self): \"\"\"Clear the selection If the selection isn't in this widget then the command has no effect. \"\"\" return self.selection(\"clear\") def selection_element(self, element=None): \"\"\"Sets or gets the currently selected element. If a spinbutton element is specified, it will be displayed depressed. \"\"\" return self.tk.call(self._w, 'selection', 'element', element) def selection_from(self, index): \"\"\"Set the fixed end of a selection to INDEX.\"\"\" self.selection('from', index) def selection_present(self): \"\"\"Return True if there are characters selected in the spinbox, False otherwise.\"\"\" return self.tk.getboolean( self.tk.call(self._w, 'selection', 'present')) def selection_range(self, start, end): \"\"\"Set the selection from START to END (not included).\"\"\" self.selection('range', start, end) def selection_to(self, index): \"\"\"Set the variable end of a selection to INDEX.\"\"\" self.selection('to', index) ########################################################################### class LabelFrame(Widget): \"\"\"labelframe widget.\"\"\" def __init__(self, master=None, cnf={}, **kw): \"\"\"Construct a labelframe widget with the parent MASTER. STANDARD OPTIONS borderwidth, cursor, font, foreground, highlightbackground, highlightcolor, highlightthickness, padx, pady, relief, takefocus, text WIDGET-SPECIFIC OPTIONS background, class, colormap, container, height, labelanchor, labelwidget, visual, width \"\"\" Widget.__init__(self, master, 'labelframe', cnf, kw) ######################################################################## class PanedWindow(Widget): \"\"\"panedwindow widget.\"\"\" def __init__(self, master=None, cnf={}, **kw): \"\"\"Construct a panedwindow widget with the parent MASTER. STANDARD OPTIONS background, borderwidth, cursor, height, orient, relief, width WIDGET-SPECIFIC OPTIONS handlepad, handlesize, opaqueresize, sashcursor, sashpad, sashrelief, sashwidth, showhandle, \"\"\" Widget.__init__(self, master, 'panedwindow', cnf, kw) def add(self, child, **kw): \"\"\"Add a child widget to the panedwindow in a new pane. The child argument is the name of the child widget followed by pairs of arguments that specify how to manage the windows. The possible options and values are the ones accepted by the paneconfigure method. \"\"\" self.tk.call((self._w, 'add', child) + self._options(kw)) def remove(self, child): \"\"\"Remove the pane containing child from the panedwindow All geometry management options for child will be forgotten. \"\"\" self.tk.call(self._w, 'forget', child) forget = remove def identify(self, x, y): \"\"\"Identify the panedwindow component at point x, y If the point is over a sash or a sash handle, the result is a two element list containing the index of the sash or handle, and a word indicating whether it is over a sash or a handle, such as {0 sash} or {2 handle}. If the point is over any other part of the panedwindow, the result is an empty list. \"\"\" return self.tk.call(self._w, 'identify', x, y) def proxy(self, *args): \"\"\"Internal function.\"\"\" return self._getints( self.tk.call((self._w, 'proxy') + args)) or () def proxy_coord(self): \"\"\"Return the x and y pair of the most recent proxy location \"\"\" return self.proxy(\"coord\") def proxy_forget(self): \"\"\"Remove the proxy from the display. \"\"\" return self.proxy(\"forget\") def proxy_place(self, x, y): \"\"\"Place the proxy at the given x and y coordinates. \"\"\" return self.proxy(\"place\", x, y) def sash(self, *args): \"\"\"Internal function.\"\"\" return self._getints( self.tk.call((self._w, 'sash') + args)) or () def sash_coord(self, index): \"\"\"Return the current x and y pair for the sash given by index. Index must be an integer between 0 and 1 less than the number of panes in the panedwindow. The coordinates given are those of the top left corner of the region containing the sash. pathName sash dragto index x y This command computes the difference between the given coordinates and the coordinates given to the last sash coord command for the given sash. It then moves that sash the computed difference. The return value is the empty string. \"\"\" return self.sash(\"coord\", index) def sash_mark(self, index): \"\"\"Records x and y for the sash given by index; Used in conjunction with later dragto commands to move the sash. \"\"\" return self.sash(\"mark\", index) def sash_place(self, index, x, y): \"\"\"Place the sash given by index at the given coordinates \"\"\" return self.sash(\"place\", index, x, y) def panecget(self, child, option): \"\"\"Return the value of option for a child window.\"\"\" return self.tk.call( (self._w, 'panecget') + (child, '-'+option)) def paneconfigure(self, tagOrId, cnf=None, **kw): \"\"\"Query or modify the configuration options for a child window. Similar to configure() except that it applies to the specified window. The following options are supported: after window Insert the window after the window specified. window should be the name of a window already managed by pathName. before window Insert the window before the window specified. window should be the name of a window already managed by pathName. height size Specify a height for the window. The height will be the outer dimension of the window including its border, if any. If size is an empty string, or if -height is not specified, then the height requested internally by the window will be used initially; the height may later be adjusted by the movement of sashes in the panedwindow. Size may be any value accepted by Tk_GetPixels. minsize n Specifies that the size of the window cannot be made less than n. This constraint only affects the size of the widget in the paned dimension -- the x dimension for horizontal panedwindows, the y dimension for vertical panedwindows. May be any value accepted by Tk_GetPixels. padx n Specifies a non-negative value indicating how much extra space to leave on each side of the window in the X-direction. The value may have any of the forms accepted by Tk_GetPixels. pady n Specifies a non-negative value indicating how much extra space to leave on each side of the window in the Y-direction. The value may have any of the forms accepted by Tk_GetPixels. sticky style If a window's pane is larger than the requested dimensions of the window, this option may be used to position (or stretch) the window within its pane. Style is a string that contains zero or more of the characters n, s, e or w. The string can optionally contains spaces or commas, but they are ignored. Each letter refers to a side (north, south, east, or west) that the window will \"stick\" to. If both n and s (or e and w) are specified, the window will be stretched to fill the entire height (or width) of its cavity. width size Specify a width for the window. The width will be the outer dimension of the window including its border, if any. If size is an empty string, or if -width is not specified, then the width requested internally by the window will be used initially; the width may later be adjusted by the movement of sashes in the panedwindow. Size may be any value accepted by Tk_GetPixels. \"\"\" if cnf is None and not kw: return self._getconfigure(self._w, 'paneconfigure', tagOrId) if isinstance(cnf, str) and not kw: return self._getconfigure1( self._w, 'paneconfigure', tagOrId, '-'+cnf) self.tk.call((self._w, 'paneconfigure', tagOrId) + self._options(cnf, kw)) paneconfig = paneconfigure def panes(self): \"\"\"Returns an ordered list of the child panes.\"\"\" return self.tk.splitlist(self.tk.call(self._w, 'panes')) # Test: def _test(): root = Tk() text = \"This is Tcl/Tk %s\" % root.globalgetvar('tk_patchLevel') text += \"\\nThis should be a cedilla: \\xe7\" label = Label(root, text=text) label.pack() test = Button(root, text=\"Click me!\", command=lambda root=root: root.test.configure( text=\"[%s]\" % root.test['text'])) test.pack() root.test = test quit = Button(root, text=\"QUIT\", command=root.destroy) quit.pack() # The following three commands are needed so the window pops # up on top on Windows... root.iconify() root.update() root.deiconify() root.mainloop() __all__ = [name for name, obj in globals().items() if not name.startswith('_') and not isinstance(obj, types.ModuleType) and name not in {'wantobjects'}] if __name__ == '__main__': _test()"
