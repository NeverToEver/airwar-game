t') def flash(self): \"\"\"Flash the button.\"\"\" self.tk.call(self._w, 'flash') def invoke(self): \"\"\"Toggle the button and invoke a command if given as option.\"\"\" return self.tk.call(self._w, 'invoke') def select(self): \"\"\"Put the button in on-state.\"\"\" self.tk.call(self._w, 'select') def toggle(self): \"\"\"Toggle the button.\"\"\" self.tk.call(self._w, 'toggle') class Entry(Widget, XView): \"\"\"Entry widget which allows displaying simple text.\"\"\" def __init__(self, master=None, cnf={}, **kw): \"\"\"Construct an entry widget with the parent MASTER. Valid option names: background, bd, bg, borderwidth, cursor, exportselection, fg, font, foreground, highlightbackground, highlightcolor, highlightthickness, insertbackground, insertborderwidth, insertofftime, insertontime, insertwidth, invalidcommand, invcmd, justify, relief, selectbackground, selectborderwidth, selectforeground, show, state, takefocus, textvariable, validate, validatecommand, vcmd, width, xscrollcommand.\"\"\" Widget.__init__(self, master, 'entry', cnf, kw) def delete(self, first, last=None): \"\"\"Delete text from FIRST to LAST (not included).\"\"\" self.tk.call(self._w, 'delete', first, last) def get(self): \"\"\"Return the text.\"\"\" return self.tk.call(self._w, 'get') def icursor(self, index): \"\"\"Insert cursor at INDEX.\"\"\" self.tk.call(self._w, 'icursor', index) def index(self, index): \"\"\"Return position of cursor.\"\"\" return self.tk.getint(self.tk.call( self._w, 'index', index)) def insert(self, index, string): \"\"\"Insert STRING at INDEX.\"\"\" self.tk.call(self._w, 'insert', index, string) def scan_mark(self, x): \"\"\"Remember the current X, Y coordinates.\"\"\" self.tk.call(self._w, 'scan', 'mark', x) def scan_dragto(self, x): \"\"\"Adjust the view of the canvas to 10 times the difference between X and Y and the coordinates given in scan_mark.\"\"\" self.tk.call(self._w, 'scan', 'dragto', x) def selection_adjust(self, index): \"\"\"Adjust the end of the selection 