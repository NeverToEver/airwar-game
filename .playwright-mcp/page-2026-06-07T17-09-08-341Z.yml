                                - generic: "\"\"\"Wrapper functions for Tcl/Tk."
                          - generic:
                            - generic:
                              - generic:
                                - generic: Tkinter provides classes which allow the display, positioning and
                          - generic:
                            - generic:
                              - generic:
                                - generic: control of widgets. Toplevel widgets are Tk and Toplevel. Other
                          - generic:
                            - generic:
                              - generic:
                                - generic: widgets are Frame, Label, Entry, Text, Canvas, Button, Radiobutton,
                          - generic:
                            - generic:
                              - generic:
                                - generic: Checkbutton, Scale, Listbox, Scrollbar, OptionMenu, Spinbox
                          - generic:
                            - generic:
                              - generic:
                                - generic: LabelFrame and PanedWindow.
                          - generic:
                            - generic:
                              - generic:
                                - generic: Properties of the widgets are specified with keyword arguments.
                          - generic:
                            - generic:
                              - generic:
                                - generic: Keyword arguments have the same name as the corresponding options
                          - generic:
                            - generic:
                              - generic:
                                - generic: under Tk.
                          - generic:
                            - generic:
                              - generic:
                                - generic: Widgets are positioned with one of the geometry managers Place, Pack
                          - generic:
                            - generic:
                              - generic:
                                - generic: or Grid. These managers can be called with methods place, pack, grid
                          - generic:
                            - generic:
                              - generic:
                                - generic: available in every Widget.
                          - generic:
                            - generic:
                              - generic:
                                - generic: Actions are bound to events by options (e.g. the command
                          - generic:
                            - generic:
                              - generic:
                                - generic: keyword argument) or with the bind() method.
