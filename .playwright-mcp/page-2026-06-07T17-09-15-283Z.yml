            - heading "Extract Interface" [level=1] [ref=e18]
            - generic [ref=e19]:
              - generic [ref=e20]:
                - heading "Problem" [level=3] [ref=e21]
                - paragraph [ref=e22]: "Multiple clients are using the same part of a class interface. Another case: part of the interface in two classes is the same."
              - generic [ref=e23]:
                - heading "Solution" [level=3] [ref=e24]
                - paragraph [ref=e25]: Move this identical portion to its own interface.
            - generic [ref=e27]:
              - img "Extract Interface - Before" [ref=e30]
              - img "Extract Interface - After" [ref=e33]
            - heading "Why Refactor" [level=3] [ref=e34]
            - list [ref=e35]:
              - listitem [ref=e36]:
                - paragraph [ref=e37]:
                  - text: Interfaces are very apropos when classes play special roles in different situations. Use
                  - link "Extract Interface" [ref=e38] [cursor=pointer]:
                    - /url: /extract-interface
                  - text: to explicitly indicate which role.
              - listitem [ref=e39]:
                - paragraph [ref=e40]: Another convenient case arises when you need to describe the operations that a class performs on its server. If it’s planned to eventually allow use of servers of multiple types, all servers must implement the interface.
            - heading "Good to Know" [level=3] [ref=e41]
            - paragraph [ref=e42]:
              - text: There’s a certain resemblance between
              - link "Extract Superclass" [ref=e43] [cursor=pointer]:
                - /url: /extract-superclass
              - text: and
              - link "Extract Interface" [ref=e44] [cursor=pointer]:
                - /url: /extract-interface
              - text: .
            - paragraph [ref=e45]:
              - text: Extracting an interface allows isolating only common interfaces, not common code. In other words, if classes contain
              - link "Duplicate Code" [ref=e46] [cursor=pointer]:
                - /url: /smells/duplicate-code
              - text: ", extracting the interface won’t help you to deduplicate."
            - paragraph [ref=e47]:
              - text: All the same, this problem can be mitigated by applying
              - link "Extract Class" [ref=e48] [cursor=pointer]:
                - /url: /extract-class
              - text: to move the behavior that contains the duplication to a separate component and delegating all the work to it. If the common behavior is large in size, you can always use
              - link "Extract Superclass" [ref=e49] [cursor=pointer]:
                - /url: /extract-superclass
              - text: . This is even easier, of course, but remember that if you take this path you will get only one parent class.
            - heading "How to Refactor" [level=3] [ref=e50]
            - list [ref=e51]:
              - listitem [ref=e52]:
                - paragraph [ref=e53]: Create an empty interface.
              - listitem [ref=e54]:
                - paragraph [ref=e55]: Declare common operations in the interface.
              - listitem [ref=e56]:
                - paragraph [ref=e57]: Declare the necessary classes as implementing the interface.
              - listitem [ref=e58]:
                - paragraph [ref=e59]: Change type declarations in the client code to use the new interface.
