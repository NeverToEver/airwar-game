          - heading "Extract Class" [level=1] [ref=e18]
          - generic [ref=e19]:
            - generic [ref=e20]:
              - heading "Problem" [level=3] [ref=e21]
              - paragraph [ref=e22]: When one class does the work of two, awkwardness results.
            - generic [ref=e23]:
              - heading "Solution" [level=3] [ref=e24]
              - paragraph [ref=e25]: Instead, create a new class and place the fields and methods responsible for the relevant functionality in it.
          - generic [ref=e27]:
            - img "Extract Class - Before" [ref=e30]
            - img "Extract Class - After" [ref=e33]
          - heading "Why Refactor" [level=3] [ref=e34]
          - paragraph [ref=e35]: Classes always start out clear and easy to understand. They do their job and mind their own business as it were, without butting into the work of other classes. But as the program expands, a method is added and then a field... and eventually, some classes are performing more responsibilities than ever envisioned.
          - heading "Benefits" [level=3] [ref=e36]
          - list [ref=e37]:
            - listitem [ref=e38]:
              - paragraph [ref=e39]:
                - text: This refactoring method will help maintain adherence to the
                - emphasis [ref=e40]: Single Responsibility Principle
                - text: . The code of your classes will be more obvious and understandable.
            - listitem [ref=e41]:
              - paragraph [ref=e42]: Single-responsibility classes are more reliable and tolerant of changes. For example, say that you have a class responsible for ten different things. When you change this class to make it better for one thing, you risk breaking it for the nine others.
          - heading "Drawbacks" [level=3] [ref=e43]
          - list [ref=e44]:
            - listitem [ref=e45]:
              - text: If you “overdo it” with this refactoring technique, you will have to resort to
              - link "Inline Class" [ref=e46] [cursor=pointer]:
                - /url: /inline-class
              - text: .
          - heading "How to Refactor" [level=3] [ref=e47]
          - paragraph [ref=e48]: Before starting, decide on how exactly you want to split up the responsibilities of the class.
          - list [ref=e49]:
            - listitem [ref=e50]:
              - paragraph [ref=e51]: Create a new class to contain the relevant functionality.
            - listitem [ref=e52]:
              - paragraph [ref=e53]: Create a relationship between the old class and the new one. Optimally, this relationship is unidirectional; this allows reusing the second class without any issues. Nonetheless, if you think that a two-way relationship is necessary, this can always be set up.
            - listitem [ref=e54]:
              - paragraph [ref=e55]:
                - text: Use
                - link "Move Field" [ref=e56] [cursor=pointer]:
                  - /url: /move-field
                - text: and
                - link "Move Method" [ref=e57] [cursor=pointer]:
                  - /url: /move-method
                - text: for each field and method that you have decided to move to the new class. For methods, start with private ones in order to reduce the risk of making a large number of errors. Try to relocate just a little bit at a time and test the results after each move, in order to avoid a pileup of error-fixing at the very end.
              - paragraph [ref=e58]: After you’re done moving, take one more look at the resulting classes. An old class with changed responsibilities may be renamed for increased clarity. Check again to see whether you can get rid of two-way class relationships, if any are present.
            - listitem [ref=e59]:
              - paragraph [ref=e60]: Also give thought to accessibility to the new class from the outside. You can hide the class from the client entirely by making it private, managing it via the fields from the old class. Alternatively, you can make it a public one by allowing the client to change values directly. Your decision here depends on how safe it’s for the behavior of the old class when unexpected direct changes are made to the values in the new class.
          - generic [ref=e61]:
