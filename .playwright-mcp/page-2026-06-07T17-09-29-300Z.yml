              - text: by
              - link "verifying" [ref=e218] [cursor=pointer]:
                - /url: /wiki/Wikipedia:Verifiability
              - text: the claims made and adding
              - link "inline citations" [ref=e219] [cursor=pointer]:
                - /url: /wiki/Wikipedia:Citing_sources#Inline_citations
              - text: . Statements consisting only of original research should be removed.
            - generic [ref=e221]: (March 2025)
            - generic [ref=e223]:
              - text: (
              - link "Learn how and when to remove this message" [ref=e225] [cursor=pointer]:
                - /url: /wiki/Help:Maintenance_template_removal
              - text: )
          - paragraph [ref=e226]:
            - text: A common programming technique is to
            - link "separate" [ref=e227] [cursor=pointer]:
              - /url: /wiki/Separation_of_concerns
            - text: a large problem into several smaller problems (a
            - link "divide and conquer strategy" [ref=e228] [cursor=pointer]:
              - /url: /wiki/Divide_and_conquer_algorithm
            - text: ") and create solutions for each of them. Once the smaller problems are solved, the big problem as a whole has been solved. Therefore a given object for a small problem only needs to know about itself. Likewise, there is only one set of problems an object needs to solve: its own problems. This also follows the"
            - link "single-responsibility principle" [ref=e229] [cursor=pointer]:
              - /url: /wiki/Single-responsibility_principle
            - text: .
          - paragraph [ref=e230]:
            - text: In contrast, a program that employs a god object does not follow this approach. Most of such a program's overall functionality is coded into a single "all-knowing" object, which maintains most of the information about the entire program, and also provides most of the
            - link "methods" [ref=e231] [cursor=pointer]:
              - /url: /wiki/Subroutine
            - text: for manipulating this data. Because this object holds so much data and requires so many methods, its role in the program becomes god-like (all-knowing and all-encompassing). Instead of program objects communicating among themselves directly, the other objects within the program rely on the single god object for most of their information and interaction. Since this object is
            - link "tightly coupled" [ref=e232] [cursor=pointer]:
              - /url: /wiki/Coupling_(computer_programming)
            - text: to (referenced by) so much of the other code, maintenance becomes more difficult than it would be in a more evenly divided programming design. Changes made to the object for the benefit of one routine can have a ripple effect on other unrelated functions.
          - paragraph [ref=e233]:
            - text: A god object is the object-oriented analogue of failing to use
            - link "subroutines" [ref=e234] [cursor=pointer]:
              - /url: /wiki/Subroutine
            - text: in
            - link "procedural programming languages" [ref=e235] [cursor=pointer]:
              - /url: /wiki/Procedural_programming
            - text: ", or of using far too many"
            - link "global variables" [ref=e236] [cursor=pointer]:
              - /url: /wiki/Global_variable
            - text: to store
            - link "state" [ref=e237] [cursor=pointer]:
              - /url: /wiki/State_(computer_science)
            - text: information.
          - paragraph [ref=e238]:
            - text: Whereas creating a god object is typically considered bad programming practice, this technique is occasionally used for tight programming environments (such as
            - link "microcontrollers" [ref=e239] [cursor=pointer]:
              - /url: /wiki/Microcontroller
            - text: ), where the
            - link "performance" [ref=e240] [cursor=pointer]:
              - /url: /wiki/Computer_performance
            - text: increase and centralization of control are more important than maintainability and programming elegance.
