          - paragraph [ref=e197]:
            - text: In
            - link "object-oriented programming" [ref=e198] [cursor=pointer]:
              - /url: /wiki/Object-oriented_programming
            - text: ", a god object (sometimes also called an omniscient or all-knowing object) is an"
            - link "object" [ref=e199] [cursor=pointer]:
              - /url: /wiki/Object_(computer_science)
            - text: that references a large number of distinct types, has too many unrelated or uncategorized methods, or some combination of both.
            - superscript [ref=e200]:
              - link "[1]" [ref=e201] [cursor=pointer]:
                - /url: "#cite_note-1"
            - text: The god object is an example of an
            - link "anti-pattern" [ref=e202] [cursor=pointer]:
              - /url: /wiki/Anti-pattern
            - text: and a
            - link "code smell" [ref=e203] [cursor=pointer]:
              - /url: /wiki/Code_smell
            - text: .
            - superscript [ref=e204]:
              - link "[2]" [ref=e205] [cursor=pointer]:
                - /url: "#cite_note-2"
          - generic [ref=e206]:
            - heading "Characteristics" [level=2] [ref=e207]
            - generic [ref=e208]:
              - text: "["
              - link "edit" [ref=e209] [cursor=pointer]:
                - /url: /w/index.php?title=God_object&action=edit&section=1
              - text: "]"
          - generic [ref=e213]:
            - text: This section
            - generic [ref=e214]:
              - text: may contain
              - link "original research" [ref=e215] [cursor=pointer]:
                - /url: /wiki/Wikipedia:No_original_research
            - text: .
            - generic [ref=e216]:
              - text: Please
              - link "improve it" [ref=e217] [cursor=pointer]:
