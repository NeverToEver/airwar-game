            - text: The class
            - code [ref=e246]: GameManager
            - text: in this
            - link "C++" [ref=e247] [cursor=pointer]:
              - /url: /wiki/C%2B%2B
            - text: example can be seen as a "god object", doing everything from managing players, handling game logic, rendering, reading input and file I/O.
          - generic [ref=e249]: "import std; using std::string; using std::vector; class GameManager { private: vector<string> players; int score = 0; bool running = false; public: GameManager() = default; ~GameManager() = default; void addPlayer(const string& name) { players.push_back(name); std::println(\"Added player: {}\", name); } void listPlayers() const { std::println(\"Players:\"); for (const string& p : players) { std::println(\" - {}\", p); } } void startGame() { running = true; score = 0; std::println(\"Game started!\"); } void updateGame() { if (running) { score += 10; std::println(\"Score updated: {}\", score); } } void endGame() { running = false; std::println(\"Game over! Final score: {}\", score); } void draw() { std::println(\"[Rendering Game Screen]\"); } void handleInput(const string& input) { if (input == \"quit\") { endGame(); } else if (input == \"score\") { std::println(\"Current score: {}\", score); } else { std::println(\"Unknown input\"); } } void saveGame() { std::println(\"Saving game state to disk...\"); } void loadGame() { std::println(\"Loading game state from disk...\"); } void run() { // ... } };"
          - paragraph [ref=e250]: "Instead, this could be more appropriately divided among separated responsibilities:"
