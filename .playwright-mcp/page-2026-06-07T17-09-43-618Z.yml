  - main [ref=e40]:
    - generic [ref=e41]:
      - heading "Repository" [level=1] [ref=e42]
      - paragraph [ref=e43]: Mediates between the domain and data mapping layers using a collection-like interface for accessing domain objects.
      - paragraph [ref=e44]:
        - img [ref=e45]
      - paragraph [ref=e46]:
        - text: A system with a complex domain model often benefits from a layer, such as the one provided by
        - link "Data Mapper" [ref=e47] [cursor=pointer]:
          - /url: dataMapper.html
        - text: ", that isolates domain objects from details of the database access code. In such systems it can be worthwhile to build another layer of abstraction over the mapping layer where query construction code is concentrated. This becomes more important when there are a large number of domain classes or heavy querying. In these cases particularly, adding this layer helps minimize duplicate query logic."
      - paragraph [ref=e48]: A Repository mediates between the domain and data mapping layers, acting like an in-memory domain object collection. Client objects construct query specifications declaratively and submit them to Repository for satisfaction. Objects can be added to and removed from the Repository, as they can from a simple collection of objects, and the mapping code encapsulated by the Repository will carry out the appropriate operations behind the scenes. Conceptually, a Repository encapsulates the set of objects persisted in a data store and the operations performed over them, providing a more object-oriented view of the persistence layer. Repository also supports the objective of achieving a clean separation and one-way dependency between the domain and data mapping layers.
      - generic [ref=e49]:
        - heading "Note" [level=2] [ref=e50]
        - paragraph [ref=e51]:
          - text: You can also find a good write-up of this pattern in
          - link "Domain Driven Design" [ref=e52] [cursor=pointer]:
            - /url: https://www.amazon.com/gp/product/0321125215/ref=as_li_tl?ie=UTF8&camp=1789&creative=9325&creativeASIN=0321125215&linkCode=as2&tag=martinfowlerc-20
          - text: .
      - paragraph [ref=e53]:
        - text: for more details go to
        - link "Chapter 13" [ref=e54] [cursor=pointer]:
          - /url: https://learning.oreilly.com/library/view/patterns-of-enterprise/0321127420/ch13.html#ch13lev1sec3
        - text: of the online ebook at oreilly.com
