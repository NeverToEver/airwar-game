[build-system]
requires = ["maturin>=1.0"]
build-backend = "maturin"

[project]
name = "airwar_core"
version = "0.2.0"
requires-python = ">=3.11"

# maturin config: enable PyO3 extension-module feature and point
# maturin at the Python sources + Cargo crate. The Rust crate
# itself lives in ./Cargo.toml and exports an `airwar_core` lib
# (cdylib) declared there.
[tool.maturin]
features = ["pyo3/extension-module"]
python-source = "."
module = "airwar_core"

# cibuildwheel config: build cp311/312/313 wheels, drop
# musllinux + 32-bit linux + PyPy (PyO3 doesn't support PyPy
# and we don't ship 32-bit wheels).
[tool.cibuildwheel]
build = "cp3{11,12,13}-*"
skip = "*-musllinux_* *-manylinux_i686 pp*"
