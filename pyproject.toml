[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airwar"
version = "0.1.0"
description = "A Python and Pygame 2D air combat game with optional Rust acceleration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.6.1,<3",
    "pillow>=12.2.0,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "maturin>=1,<2",
    "pyinstaller>=6,<7",
    "ruff>=0.8,<1",
]
rust = [
    "airwar_core>=0.1.0",
]

[project.scripts]
airwar = "airwar.__main__:main"

[tool.setuptools.packages.find]
include = ["airwar*"]
exclude = ["tests*", "airwar.tests*"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    "build",
    "dist",
    "airwar_core/target",
    "vulture_whitelist.py",
]

[tool.ruff.lint]
select = ["E", "W", "F", "B", "I", "SIM", "C4", "UP", "RUF", "PT", "PLC", "PLE", "PLW"]
ignore = [
    "SIM102",
    "RUF001",   # fullwidth punctuation in Chinese strings — intentional
    "RUF003",   # ambiguous Unicode in comments — intentional Chinese text
    "PLC0415",  # import not at top level — lazy loading pattern used throughout
    "PLW0603",  # global statement — intentional for lazy singletons
    "RUF012",   # mutable class attribute — intentional in game data classes
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
ignore_missing_imports = true

# Pilot module for stricter type checking. The achievements module is
# small, self-contained, and was authored with type annotations in mind —
# making it a low-risk target for --strict before we consider widening
# the policy. See docs/mypy_status.md for the rollout plan.
[[tool.mypy.overrides]]
module = "airwar.game.achievements"
strict = true

[tool.ruff.lint.per-file-ignores]
"airwar/**/__init__.py" = ["F401"]
"airwar/config/__init__.py" = ["F401", "F403", "F405"]
"airwar/core_bindings.py" = ["F401"]
"airwar/game/systems/difficulty_strategies.py" = ["B024"]
"airwar/utils/sprites.py" = ["F401"]

# -----------------------------------------------------------------------------
# Mutation testing (mutmut 2.x)
# -----------------------------------------------------------------------------
[tool.mutmut]
backup_dir = ".mutmut-cache"
runner = "python -m pytest -x -q"
tests_dir = "airwar/tests"
paths_to_mutate = "airwar"
