[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "airwar"
version = "0.1.0"
description = "A Python and Pygame 2D air combat game with optional Rust acceleration."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pygame>=2.6.1,<3",
    "pillow>=12.2.0,<13",
]

[project.optional-dependencies]
dev = [
    "pytest>=8,<10",
    "maturin>=1,<2",
    "pyinstaller>=6,<7",
    "ruff>=0.8,<1",
]
rust = [
    "airwar_core>=0.1.0",
]

[project.scripts]
airwar = "airwar.__main__:main"

[tool.setuptools.packages.find]
include = ["airwar*"]
exclude = ["tests*", "airwar.tests*"]

[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    "build",
    "dist",
    "airwar_core/target",
    "vulture_whitelist.py",
]

# Personal hobby project: keep only the basic correctness rules.
# E = pycodestyle errors, F = pyflakes (real bugs), W = pycodestyle
# warnings (mostly real — unused variables, invalid escapes, etc.).
# Drop everything else — B (bugbear), I (isort), SIM, C4, UP, RUF,
# PT, PLC, PLE, PLW are all style preferences, not correctness.
[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = []

# mypy disabled for personal-hobby use. Re-enable per-module when
# bringing new code into the project if desired.
[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.ruff.lint.per-file-ignores]
"airwar/**/__init__.py" = ["F401"]
"airwar/config/__init__.py" = ["F401", "F403", "F405"]
"airwar/core_bindings.py" = ["F401"]
"airwar/utils/sprites.py" = ["F401"]

# -----------------------------------------------------------------------------
# Mutation testing (mutmut 2.x)
# -----------------------------------------------------------------------------
[tool.mutmut]
backup_dir = ".mutmut-cache"
runner = "python -m pytest -x -q"
tests_dir = "airwar/tests"
paths_to_mutate = "airwar"
