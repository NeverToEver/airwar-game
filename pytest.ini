[pytest]
testpaths =
    airwar/tests
    tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

markers =
    smoke: Smoke tests - core functionality verification (PR fast-path)
    slow: Tests that take longer to run (e.g., integration tests, performance tests)

addopts =
    -q
    --tb=short
    --strict-markers
    --cov=airwar
    --cov-report=term-missing

filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

console_output_style = progress
